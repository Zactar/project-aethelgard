<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Subterranea: A Dig-Dug Metroidvania</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #0c0a09;
      color: #f5f5f4;
      font-family: monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #game-header {
      position: absolute;
      top: 16px;
      display: flex;
      gap: 24px;
      font-size: 13px;
      background: rgba(28, 25, 23, 0.95);
      padding: 10px 22px;
      border-radius: 6px;
      border: 1px solid #44403c;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .hud-val {
      color: #fbbf24;
      font-weight: bold;
    }

    #viewport-canvas {
      background: #1c1917;
      border: 2px solid #78716c;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85);
      display: block;
    }

    #camera-controls-hint {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: #a8a29e;
    }
  </style>
</head>

<body>
  <div id="game-header">
    <div>SECTOR: <span id="hud-sector" class="hud-val">UPPER LOAM</span></div>
    <div>HULL: <span id="hud-hull" style="color: #ef4444; font-weight: bold;">❤❤❤</span></div>
    <div>MINERALS: <span id="hud-minerals" class="hud-val">0</span> 💎</div>
    <div>DEPTH: <span id="hud-depth" class="hud-val">0m</span></div>
  </div>

  <canvas id="viewport-canvas" width="640" height="480"></canvas>
  <div id="camera-controls-hint">WASD / Arrows: Move & Dig | [F] / [J]: Harpoon Cable | [M]: Sector Map</div>

  <script>
    const canvas = document.getElementById('viewport-canvas');
    const ctx = canvas.getContext('2d');

    const tileSize = 32;
    const cols = 20; // 640px
    const rows = 15; // 480px

    // Tile Types: 0 = Tunnel (Open Air), 1 = Dirt, 2 = Dense Granite, 3 = Boulder
    const grid = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        if (r === 0) {
          row.push(0); // Surface opening
        } else if (r === rows - 1 || c === 0 || c === cols - 1) {
          row.push(2); // Bedrock boundaries
        } else {
          row.push(1); // Destructible dirt
        }
      }
      grid.push(row);
    }

    // Kinetic Boulders
    const boulders = [
      { col: 5, row: 3, state: 'resting', timer: 0 },
      { col: 14, row: 4, state: 'resting', timer: 0 },
      { col: 8, row: 8, state: 'resting', timer: 0 }
    ];
    boulders.forEach(b => { grid[b.row][b.col] = 3; });

    // Player Excavator
    const player = {
      col: 10,
      row: 0,
      width: 24,
      height: 24,
      facing: 'down',
      color: '#38bdf8',
      harpoon: null
    };

    const keys = {};
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (k === 'arrowup' || k === 'w') movePlayer(0, -1, 'up');
      if (k === 'arrowdown' || k === 's') movePlayer(0, 1, 'down');
      if (k === 'arrowleft' || k === 'a') movePlayer(-1, 0, 'left');
      if (k === 'arrowright' || k === 'd') movePlayer(1, 0, 'right');
      if (k === 'f' || k === 'j') fireHarpoon();
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function movePlayer(dc, dr, dir) {
      const nc = player.col + dc;
      const nr = player.row + dr;
      player.facing = dir;

      if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) return;

      const targetTile = grid[nr][nc];
      // Dense granite blocks movement without the Jack-Drill
      if (targetTile === 2) return;
      // Boulders block movement directly
      if (targetTile === 3) return;

      player.col = nc;
      player.row = nr;

      // Carve through dirt
      if (targetTile === 1) {
        grid[nr][nc] = 0;
      }

      document.getElementById('hud-depth').innerText = `${nr * 10}m`;
    }

    function fireHarpoon() {
      if (player.harpoon) return;
      let dx = 0, dy = 0;
      if (player.facing === 'left') dx = -1;
      if (player.facing === 'right') dx = 1;
      if (player.facing === 'up') dy = -1;
      if (player.facing === 'down') dy = 1;

      player.harpoon = {
        x: player.col * tileSize + 16,
        y: player.row * tileSize + 16,
        dx, dy, length: 0, maxLength: tileSize * 3
      };
    }

    function updateBoulders(delta) {
      boulders.forEach(b => {
        const belowR = b.row + 1;
        if (belowR < rows && grid[belowR][b.col] === 0) {
          // Dirt beneath has been carved out!
          if (b.state === 'resting') {
            b.state = 'rumbling';
            b.timer = 0.8;
          } else if (b.state === 'rumbling') {
            b.timer -= delta;
            if (b.timer <= 0) {
              b.state = 'falling';
            }
          } else if (b.state === 'falling') {
            grid[b.row][b.col] = 0;
            b.row = belowR;
            grid[b.row][b.col] = 3;

            // Check if boulder crushed the player
            if (b.row === player.row && b.col === player.col) {
              player.col = 10;
              player.row = 0;
            }

            // Stop when hitting non-air cell
            if (b.row + 1 >= rows || grid[b.row + 1][b.col] !== 0) {
              b.state = 'resting';
            }
          }
        }
      });
    }

    function update(delta) {
      updateBoulders(delta);

      if (player.harpoon) {
        player.harpoon.length += delta * 240;
        if (player.harpoon.length >= player.harpoon.maxLength) {
          player.harpoon = null;
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Subterranean Grid
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const tile = grid[r][c];
          const x = c * tileSize;
          const y = r * tileSize;

          if (tile === 1) {
            // Destructible Dirt
            ctx.fillStyle = '#78350f';
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.fillStyle = '#92400e';
            ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
          } else if (tile === 2) {
            // Dense Granite (Bedrock)
            ctx.fillStyle = '#44403c';
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.fillStyle = '#292524';
            ctx.fillRect(x + 3, y + 3, tileSize - 6, tileSize - 6);
          } else if (tile === 3) {
            // Kinetic Boulder
            ctx.fillStyle = '#a8a29e';
            ctx.beginPath();
            ctx.arc(x + 16, y + 16, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#78716c';
            ctx.beginPath();
            ctx.arc(x + 14, y + 14, 9, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Open Tunnel
            ctx.fillStyle = '#1c1917';
            ctx.fillRect(x, y, tileSize, tileSize);
          }
        }
      }

      // Render Harpoon Cable
      if (player.harpoon) {
        const h = player.harpoon;
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(player.col * tileSize + 16, player.row * tileSize + 16);
        ctx.lineTo(h.x + h.dx * h.length, h.y + h.dy * h.length);
        ctx.stroke();
      }

      // Render Player Excavator
      const px = player.col * tileSize + 4;
      const py = player.row * tileSize + 4;
      ctx.fillStyle = player.color;
      ctx.fillRect(px, py, player.width, player.height);

      // Directional Drill Tip
      ctx.fillStyle = '#fbbf24';
      if (player.facing === 'down') ctx.fillRect(px + 8, py + player.height, 8, 4);
      if (player.facing === 'up') ctx.fillRect(px + 8, py - 4, 8, 4);
      if (player.facing === 'left') ctx.fillRect(px - 4, py + 8, 4, 8);
      if (player.facing === 'right') ctx.fillRect(px + player.width, py + 8, 4, 8);
    }

    let lastTime = performance.now();
    function gameLoop(now) {
      requestAnimationFrame(gameLoop);
      const delta = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(delta);
      render();
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>

</html>
