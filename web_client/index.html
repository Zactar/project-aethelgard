<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Aethelgard - Architectural Simulation Client</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #07090e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e0e0e0; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: absolute; top: 16px; left: 16px; width: 330px;
      background: rgba(13, 17, 24, 0.94); border: 1px solid #283347;
      border-radius: 8px; padding: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 10;
    }
    #hud h2 { margin: 0 0 8px 0; font-size: 14px; color: #4facfe; text-transform: uppercase; letter-spacing: 1px; }
    .hud-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; }
    .hud-val { font-weight: bold; color: #fff; }
    .minimap-container { margin-top: 8px; border-top: 1px solid #283347; padding-top: 8px; text-align: center; }
    #minimap { background: #0a0d14; border: 1px solid #1f2737; border-radius: 4px; display: block; margin: 0 auto; }
    .instructions { margin-top: 8px; font-size: 11px; color: #8a99ad; line-height: 1.4; text-align: left; }
    #interaction-toast {
      position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 242, 254, 0.2); border: 1px solid #00f2fe; color: #00f2fe;
      padding: 8px 24px; border-radius: 20px; font-size: 13px; font-weight: bold;
      letter-spacing: 0.5px; display: none; z-index: 15; box-shadow: 0 0 16px rgba(0,242,254,0.4);
    }
    #dialogue-box {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: 720px;
      background: rgba(13, 17, 24, 0.96); border: 1px solid #3b4760; border-radius: 8px;
      padding: 18px; box-shadow: 0 12px 36px rgba(0,0,0,0.85); display: none; z-index: 10;
    }
    #dialogue-speaker { font-weight: bold; color: #f5af19; font-size: 14px; margin-bottom: 4px; }
    #dialogue-text { font-size: 14px; line-height: 1.5; color: #f0f0f0; font-style: italic; }
    #dialogue-action { margin-top: 8px; font-size: 11px; color: #00f2fe; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn {
      width: 100%; background: #1c2433; color: #fff; border: 1px solid #4facfe;
      padding: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; margin-top: 6px;
    }
    .btn:hover { background: #4facfe; color: #080a0f; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="hud">
    <h2>Aethelgard Ground Control</h2>
    <div class="hud-row"><span>District:</span><span id="ui-district" class="hud-val">MarketSquare</span></div>
    <div class="hud-row"><span>Current Room:</span><span id="ui-room" class="hud-val" style="color: #00f2fe;">Plaza</span></div>
    <div class="hud-row"><span>Phase:</span><span id="ui-phase" class="hud-val">PEACETIME_COMMERCE</span></div>
    <div class="hud-row"><span>Prompt:</span><span id="ui-prompt" class="hud-val" style="color: #f5af19;">None</span></div>
    <div class="hud-row"><span>IPC Status:</span><span id="ui-status" class="hud-val" style="color: #ffb300;">Connecting...</span></div>
    <button class="btn" onclick="sendStressTelemetry(0.85)">Trigger Combat Spike (Stress 0.85)</button>
    <button class="btn" onclick="recenterCamera()">Recenter Camera View</button>
    
    <div class="minimap-container">
      <canvas id="minimap" width="280" height="150"></canvas>
      <div class="instructions">
        • <b>WASD / Arrows</b>: Walk Player<br>
        • <b>E Key</b>: Interact with Smart Object<br>
        • <b>Mouse Left-Drag</b>: Orbit Camera | <b>Scroll</b>: Zoom
      </div>
    </div>
  </div>

  <div id="interaction-toast">ACTIVATING SMART OBJECT...</div>

  <div id="dialogue-box">
    <div id="dialogue-speaker">NPC SPEECH</div>
    <div id="dialogue-text">...</div>
    <div id="dialogue-action">ACTION: NONE</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // 1. Scene, Camera & Lighting Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090e);
    scene.fog = new THREE.FogExp2(0x07090e, 0.00015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 10, 35000);
    camera.position.set(1400, 2400, 2600);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Unobtrusive OrbitControls that smoothly follows the player
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI / 2.15; // Prevent camera clipping below floor
    controls.minDistance = 600;
    controls.maxDistance = 6000;
    controls.target.set(1400, 80, 500);

    const hemiLight = new THREE.HemisphereLight(0xaaccff, 0x1f2430, 0.75);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff3e0, 0.8);
    sunLight.position.set(2000, 4500, 2500);
    scene.add(sunLight);

    const grid = new THREE.GridHelper(16000, 80, 0x1f2737, 0x0f131a);
    grid.position.y = -5;
    scene.add(grid);

    const architecturalGroup = new THREE.Group();
    scene.add(architecturalGroup);

    const labelGroup = new THREE.Group();
    scene.add(labelGroup);

    const smartObjectRings = [];

    // 2. Player Entity Construction (Clear Forward Facing)
    const playerGroup = new THREE.Group();

    // Body Cylinder
    const playerBody = new THREE.Mesh(
      new THREE.CylinderGeometry(60, 60, 160, 16),
      new THREE.MeshLambertMaterial({ color: 0x00f2fe, emissive: 0x003344 })
    );
    playerBody.position.y = 80;
    playerGroup.add(playerBody);

    // Front Visor / Arrow Cone (Points along -Z, our base model forward direction)
    const arrowGeo = new THREE.ConeGeometry(25, 60, 12);
    arrowGeo.rotateX(-Math.PI / 2); // Point arrow forward along -Z
    const playerVisor = new THREE.Mesh(
      arrowGeo,
      new THREE.MeshLambertMaterial({ color: 0xffd700, emissive: 0x554400 })
    );
    playerVisor.position.set(0, 100, -65);
    playerGroup.add(playerVisor);

    playerGroup.position.set(1400, 0, 500);
    scene.add(playerGroup);

    // NPC Aldous Entity
    const npcMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(60, 60, 160, 16),
      new THREE.MeshLambertMaterial({ color: 0xf5af19, emissive: 0x442200 })
    );
    npcMesh.position.set(0, 80, 2300);
    scene.add(npcMesh);

    let activeRooms = {};
    let activeSmartObjects = [];
    const keys = { w: false, a: false, s: false, d: false };

    function makeBillboardText(text, x, y, z, color = "#4facfe") {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "rgba(10, 14, 22, 0.75)";
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.roundRect(10, 10, 492, 108, 16);
      ctx.fill();
      ctx.stroke();

      ctx.font = "bold 44px sans-serif";
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
      sprite.position.set(x, y, z);
      sprite.scale.set(600, 150, 1);
      labelGroup.add(sprite);
      return sprite;
    }

    // 3. Open-Top Cutaway Architectural Room Builder
    function buildCutawayRoom(nodeId, nodeData) {
      const min = nodeData.bounds_min;
      const max = nodeData.bounds_max;
      const width = Math.abs(max.x - min.x);
      const depth = Math.abs(max.y - min.y);
      const center = nodeData.center_location;
      const isCatacomb = nodeId.includes("AQUEDUCT");
      const floorY = center.z;

      let floorColor = 0x181e2b;
      let curbColor = 0x2e3b52;
      let labelColor = "#4facfe";

      if (isCatacomb) {
        floorColor = 0x052a3a;
        curbColor = 0x00a8cc;
        labelColor = "#00f2fe";
      } else if (nodeId.includes("BAKERY")) {
        floorColor = 0x2a1c15;
        curbColor = 0x7c4323;
        labelColor = "#f5af19";
      } else if (nodeId.includes("APOTHECARY")) {
        floorColor = 0x14281f;
        curbColor = 0x2d6348;
        labelColor = "#26de81";
      }

      // Floor Slab
      const floorGeo = new THREE.BoxGeometry(width, 16, depth);
      const floorMesh = new THREE.Mesh(floorGeo, new THREE.MeshLambertMaterial({ color: floorColor }));
      floorMesh.position.set(center.x, floorY, center.y);
      architecturalGroup.add(floorMesh);

      // Low Waist-High Perimeter Curbs (70cm height keeps interior visible)
      const curbHeight = 70;
      const curbThickness = 24;
      const curbMat = new THREE.MeshLambertMaterial({ color: curbColor });

      const nsGeo = new THREE.BoxGeometry(width, curbHeight, curbThickness);
      const nCurb = new THREE.Mesh(nsGeo, curbMat);
      nCurb.position.set(center.x, floorY + (curbHeight / 2), center.y - (depth / 2));
      architecturalGroup.add(nCurb);

      const sCurb = new THREE.Mesh(nsGeo, curbMat);
      sCurb.position.set(center.x, floorY + (curbHeight / 2), center.y + (depth / 2));
      architecturalGroup.add(sCurb);

      const ewGeo = new THREE.BoxGeometry(curbThickness, curbHeight, depth);
      const wCurb = new THREE.Mesh(ewGeo, curbMat);
      wCurb.position.set(center.x - (width / 2), floorY + (curbHeight / 2), center.y);
      architecturalGroup.add(wCurb);

      const eCurb = new THREE.Mesh(ewGeo, curbMat);
      eCurb.position.set(center.x + (width / 2), floorY + (curbHeight / 2), center.y);
      architecturalGroup.add(eCurb);

      // Floating Room Title
      makeBillboardText(nodeData.zone_name, center.x, floorY + 380, center.y, labelColor);

      // Smart Object Workstations & Ground Indicator Rings
      if (nodeData.smart_objects) {
        nodeData.smart_objects.forEach(so => {
          const soPos = { x: so.relative_position.x, y: floorY + 60, z: so.relative_position.y };
          const soColor = isCatacomb ? 0x00f2fe : (nodeId.includes("BAKERY") ? 0xff7b25 : 0xff007f);

          // Workstation Box
          const soGeo = new THREE.BoxGeometry(110, 120, 110);
          const soMat = new THREE.MeshLambertMaterial({ color: soColor, emissive: soColor, emissiveIntensity: 0.35 });
          const soMesh = new THREE.Mesh(soGeo, soMat);
          soMesh.position.set(soPos.x, soPos.y, soPos.z);
          architecturalGroup.add(soMesh);

          // Local Lantern Light
          const lantern = new THREE.PointLight(soColor, 1.4, 1400);
          lantern.position.set(soPos.x, floorY + 200, soPos.y);
          architecturalGroup.add(lantern);

          // Pulsing Floor Ring Indicator (Interaction Boundary: Radius 450)
          const ringGeo = new THREE.RingGeometry(400, 450, 32);
          ringGeo.rotateX(-Math.PI / 2);
          const ringMat = new THREE.MeshBasicMaterial({ color: soColor, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.position.set(soPos.x, floorY + 8, soPos.y);
          architecturalGroup.add(ringMesh);
          smartObjectRings.push(ringMesh);

          // Floating Label
          const tagShortName = so.smart_object_tag.split('.').pop();
          makeBillboardText(`[E] ${tagShortName}`, soPos.x, floorY + 240, soPos.z, "#ffffff");

          activeSmartObjects.push({
            tag: so.smart_object_tag,
            anchor_id: so.anchor_id,
            mesh: soMesh,
            pos: soPos
          });
        });
      }
    }

    function buildPassageLinks(nodes) {
      const lineMat = new THREE.LineDashedMaterial({ color: 0x4facfe, dashSize: 60, gapSize: 30, linewidth: 2 });
      for (const [nodeId, nodeData] of Object.entries(nodes)) {
        nodeData.connected_node_ids.forEach(targetId => {
          if (nodes[targetId] && nodeId < targetId) {
            const start = nodeData.center_location;
            const end = nodes[targetId].center_location;
            const geo = new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(start.x, start.z + 10, start.y),
              new THREE.Vector3(end.x, end.z + 10, end.y)
            ]);
            const line = new THREE.Line(geo, lineMat);
            line.computeLineDistances();
            architecturalGroup.add(line);
          }
        });
      }
    }

    // 4. Real-Time Top-Down Minimap Radar
    const mapCanvas = document.getElementById("minimap");
    const mapCtx = mapCanvas.getContext("2d");

    function renderMinimap() {
      mapCtx.fillStyle = "#0a0d14";
      mapCtx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);

      const scale = 0.045;
      const offsetX = mapCanvas.width / 2;
      const offsetY = mapCanvas.height / 2;

      for (const [nodeId, node] of Object.entries(activeRooms)) {
        const min = node.bounds_min;
        const max = node.bounds_max;
        const rx = (min.x * scale) + offsetX;
        const ry = (min.y * scale) + offsetY;
        const rw = Math.abs(max.x - min.x) * scale;
        const rh = Math.abs(max.y - min.y) * scale;

        mapCtx.fillStyle = nodeId.includes("AQUEDUCT") ? "rgba(0, 168, 204, 0.4)" : "rgba(40, 51, 71, 0.45)";
        mapCtx.strokeStyle = nodeId.includes("AQUEDUCT") ? "#00f2fe" : "#3b4760";
        mapCtx.fillRect(rx, ry, rw, rh);
        mapCtx.strokeRect(rx, ry, rw, rh);
      }

      activeSmartObjects.forEach(so => {
        mapCtx.fillStyle = "#ff007f";
        mapCtx.fillRect((so.pos.x * scale) + offsetX - 2, (so.pos.z * scale) + offsetY - 2, 5, 5);
      });

      mapCtx.fillStyle = "#f5af19";
      mapCtx.beginPath();
      mapCtx.arc((npcMesh.position.x * scale) + offsetX, (npcMesh.position.z * scale) + offsetY, 4, 0, Math.PI * 2);
      mapCtx.fill();

      mapCtx.fillStyle = "#00f2fe";
      mapCtx.beginPath();
      mapCtx.arc((playerGroup.position.x * scale) + offsetX, (playerGroup.position.z * scale) + offsetY, 5, 0, Math.PI * 2);
      mapCtx.fill();
    }

    // 5. WebSocket IPC Bridge (Port 8765)
    let socket = null;
    function connectWS() {
      let wsUrl;
      const host = window.location.host;
      if (host.includes('-3000.app.github.dev')) {
        wsUrl = `wss://${host.replace('-3000', '-8765')}`;
      } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        wsUrl = `ws://localhost:8765`;
      } else {
        wsUrl = `wss://${host}`;
      }

      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        document.getElementById('ui-status').innerText = "Connected (8765)";
        document.getElementById('ui-status').style.color = "#00e676";
      };

      socket.onclose = () => {
        document.getElementById('ui-status').innerText = "Disconnected (Retrying...)";
        document.getElementById('ui-status').style.color = "#ff5252";
        setTimeout(connectWS, 2500);
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.status === "PROCESSED") {
          document.getElementById('dialogue-speaker').innerText = data.target_npc;
          document.getElementById('dialogue-text').innerText = `"${data.dialogue}"`;
          document.getElementById('dialogue-action').innerText = `EXECUTING STATETREE: ${data.action}`;
          document.getElementById('dialogue-box').style.display = 'block';

          if (data.district_unrest !== undefined) {
            document.getElementById('ui-phase').innerText = `${data.active_phase} (${data.district_unrest.toFixed(2)})`;
          }

          if (data.spatial_layout && data.spatial_layout.nodes) {
            activeRooms = data.spatial_layout.nodes;
            activeSmartObjects = [];
            smartObjectRings.length = 0;
            while (architecturalGroup.children.length > 0) architecturalGroup.remove(architecturalGroup.children[0]);
            while (labelGroup.children.length > 0) labelGroup.remove(labelGroup.children[0]);

            for (const [nodeId, nodeData] of Object.entries(activeRooms)) {
              buildCutawayRoom(nodeId, nodeData);
            }
            buildPassageLinks(activeRooms);
          }
        }
      };
    }
    connectWS();

    function sendStressTelemetry(stress) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify({
        type: "TELEMETRY_INGEST",
        district_id: "District_MarketSquare",
        player_stress: stress,
        player_coords: [playerGroup.position.x, playerGroup.position.z, playerGroup.position.y],
        seed: Math.floor(Math.random() * 90000)
      }));
    }

    function triggerSmartObjectInteraction(so) {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;

      // Visual flash on object mesh
      if (so.mesh) {
        so.mesh.material.emissiveIntensity = 1.0;
        setTimeout(() => { if (so.mesh) so.mesh.material.emissiveIntensity = 0.35; }, 400);
      }

      // Show temporary HUD toast
      const toast = document.getElementById('interaction-toast');
      toast.innerText = `ACTIVATED: ${so.anchor_id}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);

      // Dispatch explicit smart object interaction
      socket.send(JSON.stringify({
        type: "SMART_OBJECT_INTERACT",
        smart_object_id: so.anchor_id,
        smart_object_tag: so.tag,
        district_id: "District_MarketSquare",
        player_coords: [playerGroup.position.x, playerGroup.position.z, playerGroup.position.y]
      }));
    }

    function recenterCamera() {
      controls.target.set(playerGroup.position.x, playerGroup.position.y + 80, playerGroup.position.z);
      camera.position.set(playerGroup.position.x, playerGroup.position.y + 2200, playerGroup.position.z + 2400);
      controls.update();
    }

    // 6. Keyboard & Proximity Handling
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = true;
      if (k === 'a' || k === 'arrowleft') keys.a = true;
      if (k === 's' || k === 'arrowdown') keys.s = true;
      if (k === 'd' || k === 'arrowright') keys.d = true;
      if (k === ' ') recenterCamera();
      if (k === 'e') {
        let nearest = null;
        let minDist = 480.0; // Expanded, generous activation distance
        activeSmartObjects.forEach(so => {
          const d = Math.hypot(playerGroup.position.x - so.pos.x, playerGroup.position.z - so.pos.z);
          if (d < minDist) { nearest = so; minDist = d; }
        });
        if (nearest) {
          triggerSmartObjectInteraction(nearest);
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'arrowup') keys.w = false;
      if (k === 'a' || k === 'arrowleft') keys.a = false;
      if (k === 's' || k === 'arrowdown') keys.s = false;
      if (k === 'd' || k === 'arrowright') keys.d = false;
    });

    // 7. Movement & Camera Physics Loop
    function updatePlayer(delta) {
      const speed = 1400.0 * delta;
      let dx = 0, dz = 0;
      if (keys.w) dz -= speed;
      if (keys.s) dz += speed;
      if (keys.a) dx -= speed;
      if (keys.d) dx += speed;

      if (dx !== 0 || dz !== 0) {
        playerGroup.position.x += dx;
        playerGroup.position.z += dz;

        // FIXED ORIENTATION: Faces forward when pressing W (towards -Z)
        const targetRotation = Math.atan2(-dx, -dz);
        let diff = targetRotation - playerGroup.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        playerGroup.rotation.y += diff * 0.25;

        // Unobtrusive camera pan with player movement
        camera.position.x += dx;
        camera.position.z += dz;
        controls.target.x += dx;
        controls.target.z += dz;
      }

      // Check Room Boundary and Elevation
      let currentRoomName = "Outdoor Alleyways";
      let targetElevation = 0;

      for (const [nodeId, node] of Object.entries(activeRooms)) {
        const min = node.bounds_min;
        const max = node.bounds_max;
        if (playerGroup.position.x >= min.x && playerGroup.position.x <= max.x &&
            playerGroup.position.z >= min.y && playerGroup.position.z <= max.y) {
          currentRoomName = node.zone_name;
          targetElevation = node.center_location.z;
          break;
        }
      }

      playerGroup.position.y += (targetElevation - playerGroup.position.y) * 0.15;
      controls.target.y = playerGroup.position.y + 80;
      document.getElementById('ui-room').innerText = currentRoomName;

      // Smart Object Proximity Check (Radius 480)
      let promptText = "None";
      activeSmartObjects.forEach(so => {
        const dist = Math.hypot(playerGroup.position.x - so.pos.x, playerGroup.position.z - so.pos.z);
        if (dist < 480.0) {
          promptText = `${so.anchor_id} [Press E]`;
        }
      });
      document.getElementById('ui-prompt').innerText = promptText;
    }

    // 8. Main Render & Animation Loop
    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const delta = (now - lastTime) / 1000.0;
      lastTime = now;

      updatePlayer(delta);

      // Pulse Smart Object floor rings
      const pulse = 0.25 + 0.15 * Math.sin(now * 0.005);
      smartObjectRings.forEach(r => { r.material.opacity = pulse; });

      controls.update();
      renderer.render(scene, camera);
      renderMinimap();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
