<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glissade: Descent of the Yeti</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080c16;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    #viewport-container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 3px solid #334155;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
      background: #f8fafc;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 800px;
      height: 600px;
    }

    #crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
      background-size: 100% 4px;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="viewport-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="crt-overlay"></div>
  </div>

  <script>
    // =========================================================================
    // STUDIO ENGINE MICROKERNEL & BLACKBOARD
    // =========================================================================
    window.__STUDIO_ERRORS__ = [];
    window.onerror = function (msg, url, line, col, error) {
      window.__STUDIO_ERRORS__.push({ msg, line, error: error ? error.stack : null });
      console.error("[StudioEngine Error Caught]", msg, "at line", line);
      return false;
    };

    window.StudioEngine = {
      canvas: null,
      ctx: null,
      modules: {},
      hooks: {
        update: [],
        render: [],
        input: []
      },
      state: {
        running: true,
        tick: 0,
        player: {
          x: 400,
          baseViewportY: 220,
          currentViewportY: 220,
          worldDistance: 0,
          vx: 0,
          vy: 190,
          skisAngle: 0,
          jumpZ: 0,
          jumpVz: 0,
          isAirborne: false,
          trickRotation: 0,
          state: 'CRUISING',
          wipeoutTimer: 0,
          wipeouts: 0
        },
        stats: {
          VEL: 10, AGI: 10, BAL: 10, MOX: 10, LCK: 10,
          level: 1, xp: 0, nextLevelXp: 100
        },
        level: {
          obstacles: [],
          slalomGates: [],
          skiTracks: [],
          particles: [],
          speedLines: [],
          cameraShake: 0,
          nextSpawnDistance: 250
        },
        keys: { left: false, right: false, up: false, down: false, jump: false }
      },

      registerModule: function (name, moduleDef) {
        this.modules[name] = moduleDef;
        if (moduleDef.update) this.hooks.update.push(moduleDef.update.bind(moduleDef));
        if (moduleDef.render) this.hooks.render.push(moduleDef.render.bind(moduleDef));
        if (moduleDef.init) {
          try { moduleDef.init(this.state, this); }
          catch (e) { window.__STUDIO_ERRORS__.push({ msg: "Init failed: " + name, error: e.stack }); }
        }
        console.log(`[StudioEngine] Registered Module: ${name}`);
      }
    };

    window.__GAME_STATE__ = window.StudioEngine.state;

    // Key Listeners
    window.addEventListener('keydown', e => {
      const k = window.StudioEngine.state.keys;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) k.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) k.right = true;
      if (['ArrowUp', 'KeyW'].includes(e.code)) k.up = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) k.down = true;
      if (['Space'].includes(e.code)) k.jump = true;
    });
    window.addEventListener('keyup', e => {
      const k = window.StudioEngine.state.keys;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) k.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) k.right = false;
      if (['ArrowUp', 'KeyW'].includes(e.code)) k.up = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) k.down = false;
      if (['Space'].includes(e.code)) k.jump = false;
    });

    // Core Baseline Module (Downhill Physics & Base Render)
    window.StudioEngine.registerModule("BaselineDownhillEngine", {
      init: function (state, engine) {
        engine.canvas = document.getElementById('gameCanvas');
        engine.ctx = engine.canvas.getContext('2d');
        for (let dist = 300; dist < 2500; dist += 85) {
          state.level.obstacles.push({
            x: 70 + Math.random() * 660,
            worldY: dist,
            type: Math.random() < 0.6 ? 'tree' : 'rock',
            radius: 16,
            cleared: false
          });
        }
      },
      update: function (dt, state) {
        const p = state.player;
        const k = state.keys;
        const lvl = state.level;

        if (p.wipeoutTimer > 0) {
          p.wipeoutTimer -= dt;
          p.state = 'WIPEOUT';
          p.vy = Math.max(30, p.vy - 160 * dt);
          p.vx *= Math.pow(0.2, dt);
          p.skisAngle += 8 * dt;
          p.worldDistance += p.vy * dt;
          return;
        }

        if (k.up) {
          p.state = 'SNOWPLOW';
          p.vy = Math.max(80, p.vy - 360 * dt);
          p.vx *= Math.pow(0.4, dt);
        } else if (k.down) {
          p.state = 'TUCK';
          p.vy = Math.min(420, p.vy + 320 * dt);
        } else {
          p.state = 'CRUISING';
          if (p.vy < 220) p.vy += 120 * dt;
          if (p.vy > 220) p.vy -= 80 * dt;
        }

        let targetAngle = 0;
        const carveSpeed = p.state === 'TUCK' ? 290 : 440;
        if (k.left) {
          p.vx -= carveSpeed * dt;
          targetAngle = -0.42;
          p.state = p.state === 'TUCK' ? 'TUCK' : 'CARVE_LEFT';
        } else if (k.right) {
          p.vx += carveSpeed * dt;
          targetAngle = 0.42;
          p.state = p.state === 'TUCK' ? 'TUCK' : 'CARVE_RIGHT';
        } else {
          p.vx *= Math.pow(0.78, dt * 60);
        }

        p.skisAngle += (targetAngle - p.skisAngle) * Math.min(1, 12 * dt);
        p.x += p.vx * dt;
        p.x = Math.max(50, Math.min(750, p.x));
        p.worldDistance += p.vy * dt;

        if (k.jump && !p.isAirborne) {
          p.isAirborne = true;
          p.jumpVz = 340;
        }
        if (p.isAirborne) {
          p.state = 'JUMP';
          p.jumpZ += p.jumpVz * dt;
          p.jumpVz -= 880 * dt;
          if (p.jumpZ <= 0) {
            p.jumpZ = 0;
            p.isAirborne = false;
          }
        }

        // Obstacle collision
        lvl.obstacles.forEach(obs => {
          const sy = obs.worldY - p.worldDistance + p.currentViewportY;
          if (p.wipeoutTimer <= 0 && Math.abs(sy - p.currentViewportY) < 18 && Math.abs(obs.x - p.x) < 26) {
            if (!obs.cleared) {
              p.wipeouts++;
              p.wipeoutTimer = 1.4;
              lvl.cameraShake = 18;
            }
          }
        });
      },
      render: function (ctx, state) {
        const p = state.player;
        const lvl = state.level;

        ctx.save();
        if (lvl.cameraShake > 0) {
          ctx.translate((Math.random() - 0.5) * lvl.cameraShake, (Math.random() - 0.5) * lvl.cameraShake);
          lvl.cameraShake *= 0.86;
        }

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, 800, 600);

        // Downhill slope stripes
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1.5;
        const offset = -(p.worldDistance % 70);
        for (let y = offset; y < 600; y += 70) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(800, y);
          ctx.stroke();
        }

        // Draw obstacles
        lvl.obstacles.forEach(obs => {
          const sy = obs.worldY - p.worldDistance + p.currentViewportY;
          if (sy < -40 || sy > 640) return;
          if (obs.type === 'tree') {
            ctx.fillStyle = '#14532d';
            ctx.beginPath();
            ctx.moveTo(obs.x, sy - 28);
            ctx.lineTo(obs.x - 18, sy + 16);
            ctx.lineTo(obs.x + 18, sy + 16);
            ctx.fill();
          } else {
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.ellipse(obs.x, sy, 14, 10, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        // Draw Skier
        ctx.save();
        ctx.translate(p.x, p.currentViewportY - p.jumpZ);
        ctx.rotate(p.skisAngle);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-8, -16, 4, 34);
        ctx.fillRect(4, -16, 4, 34);
        ctx.fillStyle = p.state === 'TUCK' ? '#dc2626' : '#ea580c';
        ctx.fillRect(-7, -8, 14, 18);
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(0, -12, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.restore();

        // Default Top HUD
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(0, 0, 800, 48);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 15px monospace';
        ctx.fillText(`SPEED: ${Math.round(p.vy * 0.22)} KM/H`, 20, 30);
        ctx.fillText(`DISTANCE: ${Math.floor(p.worldDistance / 10)}M`, 300, 30);
        ctx.fillText(`WIPEOUTS: ${p.wipeouts}`, 520, 30);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`[${p.state}]`, 700, 30);
      }
    });

    // Microkernel Main Tick Loop
    (function runStudioEngine() {
      let lastTime = performance.now();
      function tick(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        const engine = window.StudioEngine;
        engine.state.tick++;

        // Execute all module update hooks
        for (let i = 0; i < engine.hooks.update.length; i++) {
          try { engine.hooks.update[i](dt, engine.state); }
          catch (e) { window.__STUDIO_ERRORS__.push({ msg: "Update error", error: e.stack }); }
        }

        // Execute all module render hooks
        if (engine.ctx) {
          for (let i = 0; i < engine.hooks.render.length; i++) {
            try { engine.hooks.render[i](engine.ctx, engine.state); }
            catch (e) { window.__STUDIO_ERRORS__.push({ msg: "Render error", error: e.stack }); }
          }
        }

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();

    // --- AUTONOMOUS AGENT PLUGINS INJECT BELOW ---
  
  // --- [RFC Applied: RFC-20261111-F15787] Slalom gate generator with combo multiplier tracking. ---
  StudioEngine.registerModule('SlalomGateSystem', {
  init(state, engine) {
    state.slalom = {
      gates: [],
      gateIndex: 0,
      comboState: 'COMBO_INACTIVE', // COMBO_INACTIVE, COMBO_ACTIVE, COMBO_DECAYING
      comboCount: 0,
      multiplier: 1.0,
      comboTimer: 0,
      maxDuration: 3.0,
      floatingTexts: [],
      lastGeneratedY: 0,
      lastGateX: (state.level && state.level.width ? state.level.width * 0.5 : 400),
      lastGateY: 0,
      lastPolarity: 1, // 1 = Blue (Right), -1 = Red (Left)
      prevPlayerPos: {
        x: (state.player && state.player.x) || 400,
        y: (state.player && state.player.y) || 0
      },
      time: 0
    };

    // Public exclusion query for external Poisson-disk / chunk obstacle generators
    state.isSlalomExcluded = (x, y) => {
      const gates = state.slalom.gates;
      for (let i = 0; i < gates.length - 1; i++) {
        const g1 = gates[i];
        const g2 = gates[i + 1];
        const r = g2.width * 0.8;
        const rSq = r * r;
        const dx = g2.x - g1.x;
        const dy = g2.y - g1.y;
        const l2 = dx * dx + dy * dy;
        let t = 0;
        if (l2 > 0) {
          t = Math.max(0, Math.min(1, ((x - g1.x) * dx + (y - g1.y) * dy) / l2));
        }
        const projX = g1.x + t * dx;
        const projY = g1.y + t * dy;
        const distSq = (x - projX) * (x - projX) + (y - projY) * (y - projY);
        if (distSq <= rSq) return true;
      }
      return false;
    };
  },

  update(dt, state) {
    if (!state.player) return;
    const slalom = state.slalom;
    slalom.time += dt;

    const player = state.player;
    const stats = state.stats || {};
    const pX = player.x;
    const pY = player.y;
    const pPrevX = slalom.prevPlayerPos.x;
    const pPrevY = slalom.prevPlayerPos.y;

    // Check Wipeout condition
    if (player.isWipedOut || player.wipedOut) {
      if (slalom.comboState !== 'COMBO_INACTIVE') {
        slalom.comboState = 'COMBO_INACTIVE';
        slalom.comboCount = 0;
        slalom.multiplier = 1.0;
        slalom.comboTimer = 0;
      }
    }

    // Dynamic gate generation along descending Y axis
    const lookaheadY = pY + 1600;
    const minX = 100;
    const maxX = (state.level && state.level.width ? state.level.width - 100 : 700);

    if (slalom.lastGeneratedY === 0) {
      slalom.lastGeneratedY = pY + 200;
      slalom.lastGateY = slalom.lastGeneratedY;
      slalom.lastGateX = (minX + maxX) * 0.5;
    }

    const nominalVy = Math.max(280, Math.abs(player.vy || 350));
    const maxVx = Math.max(240, Math.abs(player.vxMax || 320));
    const eta = 0.75;

    while (slalom.lastGeneratedY < lookaheadY) {
      const dtTurn = 0.6 + Math.random() * 0.6; // 0.6s to 1.2s
      const dy = Math.max(240, Math.min(480, nominalVy * dtTurn));
      const nextY = slalom.lastGeneratedY + dy;

      // Kinematic reachable bounds
      const maxDx = (maxVx / nominalVy) * dy * eta;
      const targetPolarity = -slalom.lastPolarity; // Alternating polarity
      const lateralBias = targetPolarity * (maxDx * 0.6 + Math.random() * maxDx * 0.35);
      let nextX = slalom.lastGateX + lateralBias;
      nextX = Math.max(minX, Math.min(maxX, nextX));

      // Re-verify kinematic solvability after clamping
      if (Math.abs(nextX - slalom.lastGateX) > maxDx) {
        nextX = slalom.lastGateX + Math.sign(nextX - slalom.lastGateX) * maxDx;
      }

      const totalDist = nextY;
      const gateWidth = Math.max(70, Math.min(110, 110 - (totalDist / 5000) * 10));

      const newGate = {
        id: slalom.

  // --- [RFC Applied: RFC-20261111-4C0E1C] Stat tracking system: Velocity, Agility, Balance, Moxie, Luck. ---
  StudioEngine.registerModule("StatTracker", {
  init(state, engine) {
    const defaultStats = { VEL: 25, AGI: 20, BAL: 20, MOX: 15, LCK: 12 };
    const base = Object.assign({}, defaultStats, (state.stats && state.stats.base) || {});
    const modifiers = Object.assign({ VEL: 0, AGI: 0, BAL: 0, MOX: 0, LCK: 0 }, (state.stats && state.stats.modifiers) || {});

    state.stats = {
      base,
      modifiers,
      level: (state.stats && state.stats.level) || 1,
      currentXP: (state.stats && state.stats.currentXP) || 0,
      statusMask: (state.stats && state.stats.statusMask) || 0,
      recoveryTimer: 0.0,
      maxRecoveryTimer: 0.0,
      majorWipeouts: (state.stats && state.stats.majorWipeouts) || 0,
      maxWipeouts: 3,

      // Bitmask Constants
      FLAG_AIRBORNE: 0x0001,
      FLAG_TUCKED: 0x0002,
      FLAG_CARVING_LEFT: 0x0004,
      FLAG_CARVING_RIGHT: 0x0008,
      FLAG_BRAKING: 0x0010,
      FLAG_WIPEOUT: 0x0020,
      FLAG_INVULNERABLE: 0x0040,
      FLAG_YETI_TERROR: 0x0080,
      FLAG_CRITICAL_STABILITY: 0x0100,

      getStat(statKey) {
        const b = this.base[statKey] || 1;
        const m = this.modifiers[statKey] || 0;
        return Math.max(1, Math.min(99, Math.floor(b + m)));
      },

      getXPRequirement(lvl) {
        return Math.floor(100 * Math.pow(lvl, 1.65) + ((lvl - 1) * 45));
      },

      addXP(amount) {
        this.currentXP += amount;
        let leveledUp = false;
        while (this.currentXP >= this.getXPRequirement(this.level)) {
          this.currentXP -= this.getXPRequirement(this.level);
          this.level++;
          leveledUp = true;
          if (state.level) state.level.current = this.level;
        }
        return leveledUp;
      },

      getNearMissXP() {
        const mox = this.getStat('MOX');
        return Math.floor(15 * (1.0 + (mox * 0.02)));
      },

      getGateClearedXP() {
        const mox = this.getStat('MOX');
        const lck = this.getStat('LCK');
        return Math.floor(40 * (1.0 + (mox * 0.015)) * (1.0 + (lck * 0.005)));
      },

      getDerivedKinematics() {
        const vel = this.getStat('VEL');
        const agi = this.getStat('AGI');
        const bal = this.getStat('BAL');
        const mox = this.getStat('MOX');
        const lck = this.getStat('LCK');

        const isTucked = (this.statusMask & this.FLAG_TUCKED) !== 0;
        const isTerror = (this.statusMask & this.FLAG_YETI_TERROR) !== 0;

        let vyMax = 350.0 + (vel * 8.5);
        if (isTucked) vyMax *= (1.25 + (vel * 0.002));
        if (isTerror) vyMax *= (1.0 + (mox * 0.008));

        let ax = 420.0 + (agi * 11.2);
        if (isTucked) ax *= 0.60;

        return {
          vyMax,
          ax,
          dx: 0.88 + (0.09 * (1.0 - (agi / 100.0))),
          recoveryTime: Math.max(0.35, 2.50 - (bal * 0.022)),
          stabilityThreshold: Math.min(0.95, 0.20 + (bal * 0.008)),
          spinOmega: 4.188 + (mox * 0.125),
          gateMagnetRadius: 16.0 + (lck * 0.45),
          critRecoveryProb: Math.min(0.35, lck * 0.0035)
        };
      },

      triggerWipeout(prngValue = Math.random()) {
        const kinematics = this.getDerivedKinematics();
        if (prngValue < kinematics.critRecoveryProb) {
          this.statusMask |= this.FLAG_CRITICAL_STABILITY;
          return false;
        }
        this.majorWipeouts++;
        this.statusMask |= this.FLAG_WIPEOUT;
        this.recoveryTimer = kinematics.recoveryTime;
        this.maxRecoveryTimer = kinematics.recoveryTime;
        return true;
      }
    };

    if (state.player) {
      state.player.kinematics = state.stats.getDerivedKinematics();
    }
  },

  update(dt, state) {
    const s = state.stats;
    if (!s) return;

    if (state.yeti && state.player) {
      const dx = (state.yeti.x || 0) - (state.player.x || 0);
      const dy = (state.yeti.y || 0) - (state.player.y || 0);
      const dist = Math.hypot(dx, dy);
      if (dist < 300) {
        s.statusMask |= s.FLAG_YETI_TERROR;
      } else {
        s.statusMask &= ~s.FLAG_YETI_TERROR;
      }
    }

    if (s.statusMask & s.FLAG_WIPEOUT) {
      s.recoveryTimer -= dt;
      if (s.recoveryTimer <= 0) {
        s.recoveryTimer = 0;
        s.statusMask &= ~s.FLAG_WIPEOUT;
        s.statusMask &= ~s.FLAG_CRITICAL_STABILITY;
      }
    }

    const kinematics = s.getDerivedKinematics();
    if (state.player) {
      state.player.kinematics = kinematics;
      state.player.statusMask = s.statusMask;
      state.player.isWipedOut = (s.statusMask & s.FLAG_WIPEOUT) !== 0;
    }
  },

  render(ctx, state) {
    const s = state.stats;
    if (!s) return;

    ctx.save();

    // 1. Stat HUD Panel (Top-Right)
    const panelX = ctx.canvas.width - 210;
    const panelY = 14;
    const panelW = 196;
    const panelH = 156;

    ctx.fillStyle = 'rgba(11, 16, 26, 0.82)';
    ctx.strokeStyle = 'rgba(80, 160, 220, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(panelX, panelY, panelW, panelH, 6);
    ctx.fill();
    ctx.stroke();

    // Header: Level & Status Badges
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#6ee7b7';
    ctx.fillText(`LVL ${s.level}`, panelX + 12, panelY + 18);

    const xpReq = s.getXPRequirement(s.level);
    const xpRatio = Math.min(1.0, Math.max(0.0, s.currentXP / xpReq));

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillRect(panelX + 60, panelY + 10, panelW - 72, 8);
    ctx.fillStyle = '#10b981';
    ctx.fillRect(panelX + 60, panelY + 10, (panelW - 72) * xpRatio, 8);

    // Active Status Pills
    let tagX = panelX + 12;
    const tagY = panelY + 34;
    const drawTag = (text, bg, fg) => {
      ctx.font = '9px sans-serif';
      const tw = ctx.measureText(text).width + 8;
      ctx.fillStyle = bg;
      ctx.fillRect(tagX, tagY - 9, tw, 12);
      ctx.fillStyle = fg;
      ctx.fillText(text, tagX + 4, tagY);
      tagX += tw + 4;
    };

    if (s.statusMask & s.FLAG_TUCKED) drawTag('TUCK', '#1e3a8a', '#93c5fd');
    if (s.statusMask & s.FLAG_AIRBORNE) drawTag('AIR', '#581c87', '#d8b4fe');
    if (s.statusMask & s.FLAG_YETI_TERROR) drawTag('TERROR', '#7f1d1d', '#fca5a5');
    if (s.statusMask & s.FLAG_CRITICAL_STABILITY) drawTag('STABLE', '#065f46', '#6ee7b7');

    // Stat Value Mini Bars
    const statsList = [
      { key: 'VEL', label: 'VEL', color: '#38bdf8' },
      { key: 'AGI', label: 'AGI', color: '#f43f5e' },
      { key: 'BAL', label: 'BAL', color: '#fbbf24' },
      { key: 'MOX', label: 'MOX', color: '#a855f7' },
      { key: 'LCK', label: 'LCK', color: '#34d399' }
    ];

    statsList.forEach((statDef, index) => {
      const rowY = panelY + 50 + (index * 19);
      const val = s.getStat(statDef.key);

      ctx.fillStyle = '#94a3b8';

  // --- [RFC Applied: RFC-20261111-7AC25D] Starting class selection screen (Olympian, Daredevil, Ranger, Occultist). ---
  StudioEngine.registerModule('classSelectionScreen', {
  init(state, engine) {
    if (!state.player) state.player = {};
    if (!state.stats) state.stats = {};

    state.classSelection = {
      active: state.player.class === undefined,
      selectedIndex: 0,
      animTime: 0,
      cooldown: 0,
      classes: [
        {
          id: 'olympian',
          name: 'OLYMPIAN',
          title: 'Titan of the Slopes',
          color: '#F59E0B',
