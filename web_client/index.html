<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glissade: Descent of the Yeti</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080c16;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    #viewport-container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 3px solid #334155;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
      background: #f8fafc;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 800px;
      height: 600px;
    }

    #crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
      background-size: 100% 4px;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="viewport-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="crt-overlay"></div>
  </div>

  <script>
    (function glissadeEngine() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // Controls
      const keys = { left: false, right: false, up: false, down: false, jump: false };
      window.addEventListener('keydown', e => {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
        if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
        if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = true;
        if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = true;
        if (['Space'].includes(e.code)) keys.jump = true;
      });
      window.addEventListener('keyup', e => {
        if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
        if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
        if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = false;
        if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false;
        if (['Space'].includes(e.code)) keys.jump = false;
      });

      // Player State
      const player = {
        x: 400,
        baseViewportY: 220,
        currentViewportY: 220,
        worldDistance: 0,
        vx: 0,
        vy: 190,
        angularVelocity: 0,
        skisAngle: 0,
        jumpZ: 0,
        jumpVz: 0,
        isAirborne: false,
        trickRotation: 0,
        state: 'CRUISING',
        wipeoutTimer: 0,
        wipeouts: 0,
        width: 24,
        height: 36
      };

      const skiTracks = [];
      const obstacles = [];
      const particles = [];
      const speedLines = [];
      let nextSpawnDistance = 250;
      let cameraShake = 0;
      let lastTime = performance.now();
      let tickCount = 0;

      window.__GAME_STATE__ = {
        title: "Glissade: Descent of the Yeti",
        running: true,
        tick: 0,
        player: player,
        obstaclesCount: 0
      };

      function spawnInitialObstacles() {
        for (let dist = 300; dist < 3000; dist += 85) {
          spawnObstacleRow(dist);
        }
      }

      function spawnObstacleRow(dist) {
        const roll = Math.random();
        let type = 'tree';
        if (roll < 0.45) type = 'tree';
        else if (roll < 0.65) type = 'rock';
        else if (roll < 0.82) type = 'mogul';
        else type = 'gate';

        const x = 70 + Math.random() * 660;
        obstacles.push({
          x: x,
          worldY: dist,
          type: type,
          radius: type === 'tree' ? 18 : (type === 'rock' ? 14 : 20),
          cleared: false
        });
      }

      function spawnSnowSpray(x, y, count, dirX, power = 1) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x: x + (Math.random() - 0.5) * 6,
            y: y + (Math.random() - 0.5) * 4,
            vx: dirX * (50 + Math.random() * 90) * power,
            vy: -20 - Math.random() * 40 * power,
            life: 0.3 + Math.random() * 0.25,
            maxLife: 0.45,
            size: 2 + Math.random() * 2.5
          });
        }
      }

      function recordSkiTrack() {
        if (player.isAirborne || player.state === 'WIPEOUT') return;
        const cos = Math.cos(player.skisAngle);
        const sin = Math.sin(player.skisAngle);
        const spacing = player.state === 'SNOWPLOW' ? 9 : 6;
        skiTracks.push({
          lx: player.x - cos * spacing,
          rx: player.x + cos * spacing,
          worldY: player.worldDistance,
          alpha: 0.22
        });
        if (skiTracks.length > 350) skiTracks.shift();
      }

      function updatePlayerKinematics(dt) {
        // Dynamic camera leading based on downhill speed
        const targetViewportY = 220 - (player.vy - 180) * 0.25;
        player.currentViewportY += (targetViewportY - player.currentViewportY) * Math.min(1, 4 * dt);

        if (player.wipeoutTimer > 0) {
          player.wipeoutTimer -= dt;
          player.state = 'WIPEOUT';
          player.vy = Math.max(30, player.vy - 160 * dt);
          player.vx *= Math.pow(0.2, dt);
          player.skisAngle += 8 * dt;
          player.worldDistance += player.vy * dt;
          return;
        }

        // Movement State & Acceleration
        if (keys.up) {
          player.state = 'SNOWPLOW';
          player.vy = Math.max(80, player.vy - 360 * dt);
          player.vx *= Math.pow(0.4, dt);
          spawnSnowSpray(player.x, player.currentViewportY + 8, 2, -1, 0.7);
          spawnSnowSpray(player.x, player.currentViewportY + 8, 2, 1, 0.7);
        } else if (keys.down) {
          player.state = 'TUCK';
          player.vy = Math.min(420, player.vy + 320 * dt);
        } else {
          player.state = 'CRUISING';
          if (player.vy < 220) player.vy += 120 * dt;
          if (player.vy > 220) player.vy -= 80 * dt;
        }

        // Smooth Carving with Centripetal Friction
        let targetAngle = 0;
        const carveAuthority = player.state === 'TUCK' ? 290 : 440;
        if (keys.left) {
          player.vx -= carveAuthority * dt;
          targetAngle = -0.42;
          player.state = player.state === 'TUCK' ? 'TUCK' : 'CARVE_LEFT';
          spawnSnowSpray(player.x + 8, player.currentViewportY + 12, 3, 1, 1.2);
          player.vy -= 30 * dt; // Carving bleeds slight speed
        } else if (keys.right) {
          player.vx += carveAuthority * dt;
          targetAngle = 0.42;
          player.state = player.state === 'TUCK' ? 'TUCK' : 'CARVE_RIGHT';
          spawnSnowSpray(player.x - 8, player.currentViewportY + 12, 3, -1, 1.2);
          player.vy -= 30 * dt;
        } else {
          player.vx *= Math.pow(0.78, dt * 60);
        }

        // Smooth Angular Damping
        player.skisAngle += (targetAngle - player.skisAngle) * Math.min(1, 12 * dt);
        player.x += player.vx * dt;
        player.x = Math.max(50, Math.min(750, player.x));
        player.worldDistance += player.vy * dt;

        // Jump Parabola & Tricks
        if (keys.jump && !player.isAirborne) {
          player.isAirborne = true;
          player.jumpVz = 340;
          player.state = 'JUMP';
          player.trickRotation = 0;
        }

        if (player.isAirborne) {
          player.state = 'JUMP';
          player.jumpZ += player.jumpVz * dt;
          player.jumpVz -= 880 * dt;

          // Airborne trick spinning
          if (keys.left) player.trickRotation -= 7 * dt;
          if (keys.right) player.trickRotation += 7 * dt;

          if (player.jumpZ <= 0) {
            player.jumpZ = 0;
            player.isAirborne = false;
            player.trickRotation = 0;
            cameraShake = 8;
            spawnSnowSpray(player.x, player.currentViewportY + 10, 10, 1, 1.4);
            spawnSnowSpray(player.x, player.currentViewportY + 10, 10, -1, 1.4);
          }
        }

        // Speedlines when tucked
        if (player.state === 'TUCK' && Math.random() < 0.6) {
          speedLines.push({
            x: player.x + (Math.random() - 0.5) * 120,
            y: -20,
            vy: player.vy * 1.5,
            len: 30 + Math.random() * 40,
            alpha: 0.5
          });
        }

        recordSkiTrack();
      }

      function updateObstacles(dt) {
        while (nextSpawnDistance < player.worldDistance + 1300) {
          spawnObstacleRow(nextSpawnDistance);
          nextSpawnDistance += 70 + Math.random() * 50;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          const screenY = obs.worldY - player.worldDistance + player.currentViewportY;

          if (screenY < -100) {
            obstacles.splice(i, 1);
            continue;
          }

          // Bounding collision
          if (player.wipeoutTimer <= 0 && Math.abs(screenY - player.currentViewportY) < 18 && Math.abs(obs.x - player.x) < (obs.radius + 10)) {
            if ((obs.type === 'rock' || obs.type === 'mogul') && player.isAirborne && player.jumpZ > 14) {
              obs.cleared = true;
              continue;
            }

            if (obs.type === 'gate') {
              obs.cleared = true;
              cameraShake = 4;
              continue;
            }

            if (!obs.cleared) {
              player.wipeouts++;
              player.wipeoutTimer = 1.4;
              cameraShake = 18;
              spawnSnowSpray(player.x, player.currentViewportY, 20, 1, 2);
              spawnSnowSpray(player.x, player.currentViewportY, 20, -1, 2);
            }
          }
        }
        window.__GAME_STATE__.obstaclesCount = obstacles.length;
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
        }

        for (let i = speedLines.length - 1; i >= 0; i--) {
          const sl = speedLines[i];
          sl.y += sl.vy * dt;
          sl.alpha -= dt * 0.8;
          if (sl.y > 620 || sl.alpha <= 0) speedLines.splice(i, 1);
        }
      }

      function render() {
        ctx.save();
        if (cameraShake > 0) {
          ctx.translate((Math.random() - 0.5) * cameraShake, (Math.random() - 0.5) * cameraShake);
          cameraShake *= 0.86;
        }

        // Snow Field
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Procedural Slope Contours
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1.5;
        const stripeOffset = -(player.worldDistance % 70);
        for (let y = stripeOffset; y < canvas.height; y += 70) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }

        // Persistent Ski Tracks
        skiTracks.forEach(t => {
          const sy = t.worldY - player.worldDistance + player.currentViewportY;
          if (sy < -20 || sy > 620) return;
          ctx.fillStyle = `rgba(148, 163, 184, ${t.alpha})`;
          ctx.fillRect(t.lx, sy, 2, 4);
          ctx.fillRect(t.rx, sy, 2, 4);
        });

        // Speed lines
        speedLines.forEach(sl => {
          ctx.strokeStyle = `rgba(100, 116, 139, ${sl.alpha})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(sl.x, sl.y);
          ctx.lineTo(sl.x, sl.y + sl.len);
          ctx.stroke();
        });

        // Render Obstacles
        obstacles.forEach(obs => {
          const sy = obs.worldY - player.worldDistance + player.currentViewportY;
          if (sy < -60 || sy > 660) return;

          if (obs.type === 'tree') {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
            ctx.beginPath();
            ctx.ellipse(obs.x + 4, sy + 18, 12, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#14532d';
            ctx.beginPath();
            ctx.moveTo(obs.x, sy - 28);
            ctx.lineTo(obs.x - 18, sy + 16);
            ctx.lineTo(obs.x + 18, sy + 16);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#166534';
            ctx.beginPath();
            ctx.moveTo(obs.x, sy - 24);
            ctx.lineTo(obs.x - 14, sy + 6);
            ctx.lineTo(obs.x + 14, sy + 6);
            ctx.closePath();
            ctx.fill();
          } else if (obs.type === 'rock') {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
            ctx.beginPath();
            ctx.ellipse(obs.x + 3, sy + 6, 14, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.ellipse(obs.x, sy, 14, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath();
            ctx.ellipse(obs.x - 3, sy - 3, 6, 4, 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (obs.type === 'mogul') {
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.ellipse(obs.x, sy, 20, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.ellipse(obs.x - 2, sy - 2, 14, 5, 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (obs.type === 'gate') {
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(obs.x - 34, sy - 22, 5, 28);
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(obs.x + 30, sy - 22, 5, 28);
          }
        });

        // Snow Particles
        ctx.fillStyle = '#ffffff';
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        // Skier
        ctx.save();
        const py = player.currentViewportY - player.jumpZ;
        ctx.translate(player.x, py);

        // Dynamic Jump Shadow
        if (player.jumpZ > 0) {
          ctx.fillStyle = `rgba(15, 23, 42, ${Math.max(0.08, 0.35 - player.jumpZ * 0.003)})`;
          ctx.beginPath();
          ctx.ellipse(0, player.jumpZ + 12, 14 + player.jumpZ * 0.05, 7, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.rotate(player.skisAngle + player.trickRotation);

        if (player.state === 'WIPEOUT') {
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(-12, -8, 24, 16);
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-14, -12, 8, 5);
        } else {
          // Skis
          ctx.fillStyle = '#0284c7';
          if (player.state === 'SNOWPLOW') {
            ctx.save();
            ctx.rotate(-0.25);
            ctx.fillRect(-9, -16, 4, 34);
            ctx.restore();
            ctx.save();
            ctx.rotate(0.25);
            ctx.fillRect(5, -16, 4, 34);
            ctx.restore();
          } else {
            ctx.fillRect(-8, -16, 4, 34);
            ctx.fillRect(4, -16, 4, 34);
          }

          // Body & Jacket
          ctx.fillStyle = player.state === 'TUCK' ? '#dc2626' : '#ea580c';
          const bodyHeight = player.state === 'TUCK' ? 12 : 18;
          ctx.fillRect(-7, -8, 14, bodyHeight);

          // Helmet & Goggles
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.arc(0, -12, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#facc15';
          ctx.fillRect(-4, -14, 8, 4);
        }
        ctx.restore();
        ctx.restore();

        // CRT Retro HUD
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(0, 0, canvas.width, 48);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 15px "Courier New", monospace';
        ctx.textAlign = 'left';
        const speedKmH = Math.round(player.vy * 0.22);
        ctx.fillText(`SPEED: ${speedKmH} KM/H`, 20, 30);

        ctx.textAlign = 'center';
        const distMeters = Math.floor(player.worldDistance / 10);
        ctx.fillText(`DISTANCE: ${distMeters}M`, 300, 30);

        ctx.fillStyle = player.wipeouts > 0 ? '#f87171' : '#4ade80';
        ctx.fillText(`WIPEOUTS: ${player.wipeouts}`, 500, 30);

        ctx.textAlign = 'right';
        ctx.fillStyle = player.state === 'TUCK' ? '#ef4444' : (player.state === 'JUMP' ? '#a855f7' : '#38bdf8');
        ctx.fillText(`[${player.state}]`, 780, 30);
      }

      function gameLoop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        tickCount++;
        window.__GAME_STATE__.tick = tickCount;

        updatePlayerKinematics(dt);
        updateObstacles(dt);
        updateParticles(dt);
        render();

        requestAnimationFrame(gameLoop);
      }

      spawnInitialObstacles();
      requestAnimationFrame(gameLoop);
    })();
