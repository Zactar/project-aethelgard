<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glissade: Descent of the Yeti</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b101e;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }
    #viewport-container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 3px solid #3a506b;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
      background: #e2e8f0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 800px;
      height: 600px;
      background: #f1f5f9;
    }
    #crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="viewport-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="crt-overlay"></div>
  </div>

  <script>
  (function glissadeEngine() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Controls
    const keys = { left: false, right: false, up: false, down: false, jump: false };
    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = true;
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = true;
      if (['Space'].includes(e.code)) keys.jump = true;
    });
    window.addEventListener('keyup', e => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false;
      if (['Space'].includes(e.code)) keys.jump = false;
    });

    // Player State Machine
    const player = {
      x: 400,
      y: 180, // Viewport Y lock
      worldDistance: 0,
      vx: 0,
      vy: 180,
      jumpZ: 0,
      jumpVz: 0,
      isAirborne: false,
      state: 'CRUISING',
      wipeoutTimer: 0,
      wipeouts: 0,
      skisAngle: 0,
      width: 24,
      height: 36
    };

    // Procedural Obstacles & Particles
    const obstacles = [];
    const particles = [];
    let nextSpawnDistance = 200;
    let cameraShake = 0;
    let lastTime = performance.now();
    let tickCount = 0;

    window.__GAME_STATE__ = {
      title: "Glissade: Descent of the Yeti",
      running: true,
      tick: 0,
      player: player,
      obstaclesCount: 0
    };

    function spawnInitialObstacles() {
      for (let dist = 300; dist < 2500; dist += 90) {
        spawnObstacleRow(dist);
      }
    }

    function spawnObstacleRow(dist) {
      const types = ['tree', 'tree', 'rock', 'mogul', 'gate'];
      const type = types[Math.floor(Math.random() * types.length)];
      const x = 60 + Math.random() * 680;
      obstacles.push({
        x: x,
        worldY: dist,
        type: type,
        radius: type === 'tree' ? 18 : (type === 'rock' ? 14 : 20),
        cleared: false
      });
    }

    function spawnSnowSpray(x, y, count, direction) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 8,
          y: y + (Math.random() - 0.5) * 6,
          vx: (direction * (40 + Math.random() * 80)),
          vy: -20 - Math.random() * 40,
          life: 0.35 + Math.random() * 0.25,
          maxLife: 0.5,
          size: 2 + Math.random() * 3
        });
      }
    }

    function updatePlayerKinematics(dt) {
      if (player.wipeoutTimer > 0) {
        player.wipeoutTimer -= dt;
        player.state = 'WIPEOUT';
        player.vy = 40;
        player.vx *= Math.pow(0.5, dt * 60);
        player.worldDistance += player.vy * dt;
        return;
      }

      // Stance & Vertical Momentum
      if (keys.up) {
        player.state = 'SNOWPLOW';
        player.vy = Math.max(90, player.vy - 320 * dt);
        player.vx *= Math.pow(0.85, dt * 60);
      } else if (keys.down) {
        player.state = 'TUCK';
        player.vy = Math.min(380, player.vy + 260 * dt);
      } else {
        player.state = 'CRUISING';
        if (player.vy < 220) player.vy += 140 * dt;
        if (player.vy > 220) player.vy -= 120 * dt;
      }

      // Lateral Carving
      let targetAngle = 0;
      const turnSpeed = player.state === 'TUCK' ? 280 : 420;
      if (keys.left) {
        player.vx -= turnSpeed * dt;
        targetAngle = -0.38;
        player.state = 'CARVE_LEFT';
        spawnSnowSpray(player.x + 8, player.y + 12, 2, 1);
      } else if (keys.right) {
        player.vx += turnSpeed * dt;
        targetAngle = 0.38;
        player.state = 'CARVE_RIGHT';
        spawnSnowSpray(player.x - 8, player.y + 12, 2, -1);
      } else {
        player.vx *= Math.pow(0.88, dt * 60);
      }

      player.skisAngle += (targetAngle - player.skisAngle) * Math.min(1, 14 * dt);
      player.x += player.vx * dt;
      player.x = Math.max(45, Math.min(755, player.x));
      player.worldDistance += player.vy * dt;

      // Jump Mechanics
      if (keys.jump && !player.isAirborne) {
        player.isAirborne = true;
        player.jumpVz = 320;
        player.state = 'JUMP';
      }

      if (player.isAirborne) {
        player.state = 'JUMP';
        player.jumpZ += player.jumpVz * dt;
        player.jumpVz -= 900 * dt;
        if (player.jumpZ <= 0) {
          player.jumpZ = 0;
          player.isAirborne = false;
          spawnSnowSpray(player.x, player.y + 10, 8, 1);
          spawnSnowSpray(player.x, player.y + 10, 8, -1);
        }
      }
    }

    function updateObstacles(dt) {
      while (nextSpawnDistance < player.worldDistance + 1200) {
        spawnObstacleRow(nextSpawnDistance);
        nextSpawnDistance += 80 + Math.random() * 45;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        const screenY = obs.worldY - player.worldDistance + player.y;

        if (screenY < -100) {
          obstacles.splice(i, 1);
          continue;
        }

        // Collision Check
        if (player.wipeoutTimer <= 0 && Math.abs(screenY - player.y) < 18 && Math.abs(obs.x - player.x) < (obs.radius + 10)) {
          if (obs.type === 'rock' || obs.type === 'mogul') {
            if (player.isAirborne && player.jumpZ > 14) {
              obs.cleared = true;
              continue;
            }
          }

          if (!obs.cleared) {
            player.wipeouts++;
            player.wipeoutTimer = 1.35;
            cameraShake = 16;
            spawnSnowSpray(player.x, player.y, 16, 1);
            spawnSnowSpray(player.x, player.y, 16, -1);
          }
        }
      }
      window.__GAME_STATE__.obstaclesCount = obstacles.length;
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }

    function render() {
      ctx.save();
      if (cameraShake > 0) {
        ctx.translate((Math.random() - 0.5) * cameraShake, (Math.random() - 0.5) * cameraShake);
        cameraShake *= 0.88;
      }

      // Snow Base
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Downhill Slope Grid Stripes
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      const stripeOffset = -(player.worldDistance % 60);
      for (let y = stripeOffset; y < canvas.height; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Render Obstacles
      obstacles.forEach(obs => {
        const sy = obs.worldY - player.worldDistance + player.y;
        if (sy < -50 || sy > 650) return;

        if (obs.type === 'tree') {
          // Evergreen Tree
          ctx.fillStyle = '#2d3748';
          ctx.beginPath();
          ctx.ellipse(obs.x, sy + 18, 10, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#166534';
          ctx.beginPath();
          ctx.moveTo(obs.x, sy - 24);
          ctx.lineTo(obs.x - 16, sy + 14);
          ctx.lineTo(obs.x + 16, sy + 14);
          ctx.closePath();
          ctx.fill();
        } else if (obs.type === 'rock') {
          // Granite Boulder
          ctx.fillStyle = '#475569';
          ctx.beginPath();
          ctx.ellipse(obs.x, sy, 14, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.ellipse(obs.x - 3, sy - 3, 7, 5, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (obs.type === 'mogul') {
          // Snow Bump
          ctx.fillStyle = '#cbd5e1';
          ctx.beginPath();
          ctx.ellipse(obs.x, sy, 18, 7, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (obs.type === 'gate') {
          // Slalom Flags
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(obs.x - 30, sy - 18, 4, 24);
          ctx.fillStyle = '#2563eb';
          ctx.fillRect(obs.x + 26, sy - 18, 4, 24);
        }
      });

      // Particles
      ctx.fillStyle = '#ffffff';
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Player Skier Rendering
      ctx.save();
      ctx.translate(player.x, player.y - player.jumpZ);

      // Shadow if jumping
      if (player.jumpZ > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.ellipse(0, player.jumpZ + 12, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.rotate(player.skisAngle);

      if (player.state === 'WIPEOUT') {
        // Tumble sprite
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-10, -6, 20, 12);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-14, -10, 8, 4);
      } else {
        // Skis
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-8, -16, 4, 34);
        ctx.fillRect(4, -16, 4, 34);
        // Ski Boots & Torso
        ctx.fillStyle = player.state === 'TUCK' ? '#dc2626' : '#ea580c';
        ctx.fillRect(-7, -10, 14, 18);
        // Head / Goggles
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(0, -14, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#facc15';
        ctx.fillRect(-4, -16, 8, 4);
      }
      ctx.restore();
      ctx.restore();

      // CRT HUD Overlay
      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.fillRect(0, 0, canvas.width, 48);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 15px "Courier New", monospace';
      ctx.textAlign = 'left';
      const speedKmH = Math.round(player.vy * 0.22);
      ctx.fillText(`SPEED: ${speedKmH} KM/H`, 20, 30);

      ctx.textAlign = 'center';
      const distMeters = Math.floor(player.worldDistance / 10);
      ctx.fillText(`DISTANCE: ${distMeters}M`, 300, 30);

      ctx.fillStyle = player.wipeouts > 0 ? '#f87171' : '#4ade80';
      ctx.fillText(`WIPEOUTS: ${player.wipeouts}`, 500, 30);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText(`[${player.state}]`, 780, 30);
    }

    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      tickCount++;
      window.__GAME_STATE__.tick = tickCount;

      updatePlayerKinematics(dt);
      updateObstacles(dt);
      updateParticles(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    spawnInitialObstacles();
    requestAnimationFrame(gameLoop);
  })();
  </script>
</body>
</html>
