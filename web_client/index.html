<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aethelgard Studio Runtime</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080c16;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    #viewport-container {
      position: relative;
      width: 800px;
      height: 600px;
      border: 3px solid #334155;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
      background: #f8fafc;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 800px;
      height: 600px;
    }

    #crt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
      background-size: 100% 4px;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="viewport-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="crt-overlay"></div>
  </div>

  <script>
    // =========================================================================
    // PROJECT AETHELGARD: UNIVERSAL STUDIO MICROKERNEL & BLACKBOARD
    // =========================================================================
    window.__STUDIO_ERRORS__ = [];
    window.onerror = function (msg, url, line, col, error) {
      window.__STUDIO_ERRORS__.push({ source: url || 'inline', msg: String(msg), line: line });
      return false;
    };

    window.StudioEngine = {
      canvas: document.getElementById('gameCanvas'),
      ctx: document.getElementById('gameCanvas').getContext('2d'),
      modules: {},
      hooks: { update: [], render: [] },
      state: {
        running: true,
        paused: false,
        tick: 0,
        player: {
          x: 400,
          baseViewportY: 220,
          currentViewportY: 220,
          worldDistance: 0,
          vx: 0,
          vy: 190,
          skisAngle: 0,
          jumpZ: 0,
          jumpVz: 0,
          isAirborne: false,
          state: 'CRUISING',
          wipeoutTimer: 0,
          wipeouts: 0,
          characterClass: 'Olympian'
        },
        stats: {
          VEL: 10, AGI: 10, BAL: 10, MOX: 10, LCK: 10,
          level: 1, xp: 0, nextLevelXp: 100, unspentPoints: 0, combo: 1
        },
        level: {
          obstacles: [],
          slalomGates: [],
          cameraShake: 0
        },
        keys: { left: false, right: false, up: false, down: false, jump: false }
      },

      registerModule: function (name, moduleDef) {
        this.modules[name] = moduleDef;
        if (typeof moduleDef.update === 'function') {
          this.hooks.update.push({ name: name, fn: moduleDef.update.bind(moduleDef) });
        }
        if (typeof moduleDef.render === 'function') {
          this.hooks.render.push({ name: name, fn: moduleDef.render.bind(moduleDef) });
        }
        if (typeof moduleDef.init === 'function') {
          try {
            moduleDef.init(this.state, this);
          } catch (e) {
            window.__STUDIO_ERRORS__.push({ source: name + '.init', msg: e.message });
          }
        }
      }
    };

    window.__GAME_STATE__ = window.StudioEngine.state;

    window.addEventListener('keydown', e => {
      const k = window.StudioEngine.state.keys;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) k.left = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) k.right = true;
      if (['ArrowUp', 'KeyW'].includes(e.code)) k.up = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) k.down = true;
      if (['Space'].includes(e.code)) k.jump = true;
    });
    window.addEventListener('keyup', e => {
      const k = window.StudioEngine.state.keys;
      if (['ArrowLeft', 'KeyA'].includes(e.code)) k.left = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) k.right = false;
      if (['ArrowUp', 'KeyW'].includes(e.code)) k.up = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) k.down = false;
      if (['Space'].includes(e.code)) k.jump = false;
    });

    // Core Baseline Module
    window.StudioEngine.registerModule("BaselineDownhillEngine", {
      init: function (state) {
        for (let dist = 300; dist < 2500; dist += 85) {
          state.level.obstacles.push({
            x: 70 + Math.random() * 660,
            worldY: dist,
            type: Math.random() < 0.6 ? 'tree' : 'rock',
            radius: 16,
            cleared: false
          });
        }
      },
      update: function (dt, state) {
        if (state.paused) return;
        const p = state.player;
        const k = state.keys;
        const lvl = state.level;
        const velMult = 1 + (state.stats.VEL - 10) * 0.03;
        const agiMult = 1 + (state.stats.AGI - 10) * 0.04;

        if (p.wipeoutTimer > 0) {
          p.wipeoutTimer -= dt;
          p.state = 'WIPEOUT';
          p.vy = Math.max(30, p.vy - 160 * dt);
          p.vx *= Math.pow(0.2, dt);
          p.skisAngle += 8 * dt;
          p.worldDistance += p.vy * dt;
          return;
        }

        if (k.up) {
          p.state = 'SNOWPLOW';
          p.vy = Math.max(80, p.vy - 360 * dt);
          p.vx *= Math.pow(0.4, dt);
        } else if (k.down) {
          p.state = 'TUCK';
          p.vy = Math.min(420 * velMult, p.vy + 320 * dt);
        } else {
          p.state = 'CRUISING';
          const cruiseTarget = 220 * velMult;
          if (p.vy < cruiseTarget) p.vy += 120 * dt;
          if (p.vy > cruiseTarget) p.vy -= 80 * dt;
        }

        let targetAngle = 0;
        const carveSpeed = (p.state === 'TUCK' ? 290 : 440) * agiMult;
        if (k.left) {
          p.vx -= carveSpeed * dt;
          targetAngle = -0.42;
          if (p.state !== 'TUCK') p.state = 'CARVE_LEFT';
        } else if (k.right) {
          p.vx += carveSpeed * dt;
          targetAngle = 0.42;
          if (p.state !== 'TUCK') p.state = 'CARVE_RIGHT';
        } else {
          p.vx *= Math.pow(0.78, dt * 60);
        }

        p.skisAngle += (targetAngle - p.skisAngle) * Math.min(1, 12 * dt);
        p.x += p.vx * dt;
        p.x = Math.max(50, Math.min(750, p.x));
        p.worldDistance += p.vy * dt;

        if (k.jump && !p.isAirborne) {
          p.isAirborne = true;
          p.jumpVz = 340;
        }
        if (p.isAirborne) {
          p.state = 'JUMP';
          p.jumpZ += p.jumpVz * dt;
          p.jumpVz -= 880 * dt;
          if (p.jumpZ <= 0) {
            p.jumpZ = 0;
            p.isAirborne = false;
          }
        }

        lvl.obstacles.forEach(obs => {
          if (obs.worldY < p.worldDistance - 150) {
            obs.worldY += 2400;
            obs.x = 70 + Math.random() * 660;
            obs.cleared = false;
          }
          const sy = obs.worldY - p.worldDistance + p.currentViewportY;
          if (p.wipeoutTimer <= 0 && Math.abs(sy - p.currentViewportY) < 18 && Math.abs(obs.x - p.x) < 24) {
            if (!obs.cleared) {
              p.wipeouts++;
              p.wipeoutTimer = Math.max(0.5, 1.4 - (state.stats.BAL - 10) * 0.05);
              lvl.cameraShake = 18;
            }
          }
        });
      },
      render: function (ctx, state) {
        const p = state.player;
        const lvl = state.level;

        ctx.save();
        if (lvl.cameraShake > 0) {
          ctx.translate((Math.random() - 0.5) * lvl.cameraShake, (Math.random() - 0.5) * lvl.cameraShake);
          lvl.cameraShake *= 0.86;
        }

        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, 800, 600);

        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1.5;
        const offset = -(p.worldDistance % 70);
        for (let y = offset; y < 600; y += 70) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(800, y);
          ctx.stroke();
        }

        lvl.obstacles.forEach(obs => {
          const sy = obs.worldY - p.worldDistance + p.currentViewportY;
          if (sy < -40 || sy > 640) return;
          if (obs.type === 'tree') {
            ctx.fillStyle = '#14532d';
            ctx.beginPath();
            ctx.moveTo(obs.x, sy - 28);
            ctx.lineTo(obs.x - 18, sy + 16);
            ctx.lineTo(obs.x + 18, sy + 16);
            ctx.fill();
          } else {
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.ellipse(obs.x, sy, 14, 10, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.save();
        ctx.translate(p.x, p.currentViewportY - p.jumpZ);
        ctx.rotate(p.skisAngle);
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(-8, -16, 4, 34);
        ctx.fillRect(4, -16, 4, 34);
        ctx.fillStyle = p.state === 'TUCK' ? '#dc2626' : '#ea580c';
        ctx.fillRect(-7, -8, 14, 18);
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.arc(0, -12, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.restore();

        // Core Top HUD
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
        ctx.fillRect(0, 0, 800, 44);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`SPD:${Math.round(p.vy * 0.22)}KM/H  DIST:${Math.floor(p.worldDistance / 10)}M  LV:${state.stats.level}  XP:${state.stats.xp}/${state.stats.nextLevelXp}`, 16, 27);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`[${p.characterClass.toUpperCase()} | ${p.state}]`, 784, 27);
      }
    });

    // Main Microkernel Loop with Fault Isolation
    (function runStudioEngine() {
      let lastTime = performance.now();
      function tick(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        const engine = window.StudioEngine;
        engine.state.tick++;

        for (let i = 0; i < engine.hooks.update.length; i++) {
          const hook = engine.hooks.update[i];
          try {
            hook.fn(dt, engine.state);
          } catch (e) {
            if (window.__STUDIO_ERRORS__.length < 10) {
              window.__STUDIO_ERRORS__.push({ source: hook.name + '.update', msg: e.message });
            }
          }
        }

        if (engine.ctx) {
          for (let i = 0; i < engine.hooks.render.length; i++) {
            const hook = engine.hooks.render[i];
            try {
              hook.fn(engine.ctx, engine.state);
            } catch (e) {
              if (window.__STUDIO_ERRORS__.length < 10) {
                window.__STUDIO_ERRORS__.push({ source: hook.name + '.render', msg: e.message });
              }
            }
          }

          // Studio Diagnostic Overlay if any agent plugin threw an error
          if (window.__STUDIO_ERRORS__.length > 0) {
            const err = window.__STUDIO_ERRORS__[0];
            engine.ctx.fillStyle = 'rgba(127, 29, 29, 0.92)';
            engine.ctx.fillRect(20, 520, 760, 60);
            engine.ctx.fillStyle = '#fecaca';
            engine.ctx.font = 'bold 12px monospace';
            engine.ctx.textAlign = 'left';
            engine.ctx.fillText(`[STUDIO PLUGIN FAULT] ${err.source}: ${err.msg}`, 32, 545);
            engine.ctx.fillText(`Total Faults: ${window.__STUDIO_ERRORS__.length} (Isolated to preserve core engine)`, 32, 565);
          }
        }

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
  <!-- AUTONOMOUS AGENT MODULE PLUGINS -->
  <script src="js/mod_RFC_20261111_6BAC24.js"></script>
  <script src="js/mod_RFC_20261111_669891.js"></script>
  <script src="js/mod_RFC_20261111_A760D1.js"></script>
</body>

</html>
