<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Subterranea: A Dig-Dug Metroidvania</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #0c0a09;
      color: #f5f5f4;
      font-family: monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #game-header {
      position: absolute;
      top: 16px;
      display: flex;
      gap: 24px;
      font-size: 13px;
      background: rgba(28, 25, 23, 0.95);
      padding: 10px 22px;
      border-radius: 6px;
      border: 1px solid #44403c;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .hud-val {
      color: #fbbf24;
      font-weight: bold;
    }

    #viewport-canvas {
      background: #1c1917;
      border: 2px solid #78716c;
      border-radius: 4px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85);
      display: block;
    }

    #camera-controls-hint {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: #a8a29e;
    }

    #game-over-banner {
      position: absolute;
      font-size: 20px;
      font-weight: bold;
      color: #ef4444;
      display: none;
      background: rgba(28, 25, 23, 0.96);
      padding: 16px 28px;
      border: 2px solid #ef4444;
      border-radius: 8px;
      text-align: center;
      z-index: 20;
    }
  </style>
</head>

<body>
  <div id="game-header">
    <div>SECTOR: <span id="hud-sector" class="hud-val">UPPER LOAM</span></div>
    <div>HULL: <span id="hud-hull" style="color: #ef4444; font-weight: bold;">❤❤❤</span></div>
    <div>ENEMIES: <span id="hud-enemies" class="hud-val">2</span> 👾</div>
    <div>DEPTH: <span id="hud-depth" class="hud-val">0m</span></div>
  </div>

  <div id="game-over-banner">
    <div>HULL BREACHED - RESPONDING AT SURFACE</div>
    <div style="font-size: 12px; color: #d6d3d1; margin-top: 6px;">PRESS [SPACE] TO RE-ENTER SHAFT</div>
  </div>

  <canvas id="viewport-canvas" width="640" height="480"></canvas>
  <div id="camera-controls-hint">WASD / Arrows: Move & Dig | [F] / [J]: Harpoon & Pump | [Space]: Respawn</div>

  <script>
    const canvas = document.getElementById('viewport-canvas');
    const ctx = canvas.getContext('2d');

    const tileSize = 32;

    // =========================================================================
    // METROIDVANIA MULTI-STRATA BIOMES & TRAVERSAL ABILITY GATES (v0.4.0)
    // =========================================================================
    const totalRows = 45; // Multi-depth crust: 0-14 Loam, 15-29 Granite, 30-44 Magma
    const viewRows = 15;
    let cameraY = 0;

    const upgrades = {
      jackDrill: false,
      jumpPiston: false
    };

    // Expand the world grid dynamically across strata
    while (grid.length < totalRows) {
      const r = grid.length;
      const row = [];
      for (let c = 0; c < cols; c++) {
        if (c === 0 || c === cols - 1 || r === totalRows - 1) {
          row.push(2); // Indestructible Bedrock borders
        } else if (r >= 14 && r <= 16) {
          row.push(2); // Dense Granite geological gate barrier
        } else if (r >= 17 && r < 30) {
          row.push(1); // Deep Granite sector
        } else if (r >= 30) {
          row.push(1); // Magma sector
        } else {
          row.push(1);
        }
      }
      grid.push(row);
    }

    // Ability Gate Pickups: Drill in Loam pocket, Piston in Granite pocket
    const relics = [
      { id: 'relic_drill', type: 'drill', col: 3, row: 12, collected: false, icon: '⚡' },
      { id: 'relic_piston', type: 'piston', col: 16, row: 24, collected: false, icon: '🚀' }
    ];
    grid[12][3] = 0; // Clear pocket for Jack-Drill
    grid[24][16] = 0; // Clear pocket for Jump-Piston

    // Additional Boulders in deeper strata
    boulders.push({ col: 7, row: 20, state: 'resting', timer: 0 });
    boulders.push({ col: 12, row: 34, state: 'resting', timer: 0 });
    grid[20][7] = 3;
    grid[34][12] = 3;

    // Additional deep fauna
    enemies.push({ id: 'pooka_deep', type: 'pooka', col: 8, row: 22, color: '#f97316', eyeColor: '#fef08a', inflateStage: 0, inflateTimer: 0, moveTimer: 0, facing: 'left' });
    enemies.push({ id: 'fygar_deep', type: 'fygar', col: 11, row: 36, color: '#22c55e', eyeColor: '#fef08a', inflateStage: 0, inflateTimer: 0, moveTimer: 0, facing: 'right', fireTimer: 3.0 });
    grid[22][8] = 0; grid[36][11] = 0;

    function checkRelicPickups() {
      relics.forEach(rel => {
        if (!rel.collected && rel.col === player.col && rel.row === player.row) {
          rel.collected = true;
          if (rel.type === 'drill') {
            upgrades.jackDrill = true;
            document.getElementById('hud-sector').innerText = 'GRANITE STRATA';
          }
          if (rel.type === 'piston') {
            upgrades.jumpPiston = true;
          }
          updateAbilitiesHUD();
        }
      });
    }

    function updateAbilitiesHUD() {
      const hint = document.getElementById('camera-controls-hint');
      if (hint) {
        let str = 'WASD / Arrows: Move & Dig | [F]/[J]: Harpoon & Pump';
        if (upgrades.jackDrill) str += ' | [DRILL ACTIVE]';
        if (upgrades.jumpPiston) str += ' | [SPACE: Piston Leap]';
        hint.innerText = str;
      }
    }


    // =========================================================================
    // METROIDVANIA MULTI-STRATA BIOMES & TRAVERSAL ABILITY GATES (v0.4.0)
    // =========================================================================
    const totalRows = 45; // Multi-depth crust: 0-14 Loam, 15-29 Granite, 30-44 Magma
    const viewRows = 15;
    let cameraY = 0;

    const upgrades = {
      jackDrill: false,
      jumpPiston: false
    };

    // Expand the world grid dynamically across strata
    while (grid.length < totalRows) {
      const r = grid.length;
      const row = [];
      for (let c = 0; c < cols; c++) {
        if (c === 0 || c === cols - 1 || r === totalRows - 1) {
          row.push(2); // Indestructible Bedrock borders
        } else if (r >= 14 && r <= 16) {
          row.push(2); // Dense Granite geological gate barrier
        } else if (r >= 17 && r < 30) {
          row.push(1); // Deep Granite sector
        } else if (r >= 30) {
          row.push(1); // Magma sector
        } else {
          row.push(1);
        }
      }
      grid.push(row);
    }

    // Ability Gate Pickups: Drill in Loam pocket, Piston in Granite pocket
    const relics = [
      { id: 'relic_drill', type: 'drill', col: 3, row: 12, collected: false, icon: '⚡' },
      { id: 'relic_piston', type: 'piston', col: 16, row: 24, collected: false, icon: '🚀' }
    ];
    grid[12][3] = 0; // Clear pocket for Jack-Drill
    grid[24][16] = 0; // Clear pocket for Jump-Piston

    // Additional Boulders in deeper strata
    boulders.push({ col: 7, row: 20, state: 'resting', timer: 0 });
    boulders.push({ col: 12, row: 34, state: 'resting', timer: 0 });
    grid[20][7] = 3;
    grid[34][12] = 3;

    // Additional deep fauna
    enemies.push({ id: 'pooka_deep', type: 'pooka', col: 8, row: 22, color: '#f97316', eyeColor: '#fef08a', inflateStage: 0, inflateTimer: 0, moveTimer: 0, facing: 'left' });
    enemies.push({ id: 'fygar_deep', type: 'fygar', col: 11, row: 36, color: '#22c55e', eyeColor: '#fef08a', inflateStage: 0, inflateTimer: 0, moveTimer: 0, facing: 'right', fireTimer: 3.0 });
    grid[22][8] = 0; grid[36][11] = 0;

    function checkRelicPickups() {
      relics.forEach(rel => {
        if (!rel.collected && rel.col === player.col && rel.row === player.row) {
          rel.collected = true;
          if (rel.type === 'drill') {
            upgrades.jackDrill = true;
            document.getElementById('hud-sector').innerText = 'GRANITE STRATA';
          }
          if (rel.type === 'piston') {
            upgrades.jumpPiston = true;
          }
          updateAbilitiesHUD();
        }
      });
    }

    function updateAbilitiesHUD() {
      const hint = document.getElementById('camera-controls-hint');
      if (hint) {
        let str = 'WASD / Arrows: Move & Dig | [F]/[J]: Harpoon & Pump';
        if (upgrades.jackDrill) str += ' | [DRILL ACTIVE]';
        if (upgrades.jumpPiston) str += ' | [SPACE: Piston Leap]';
        hint.innerText = str;
      }
    }

    const cols = 20; // 640px
    const rows = 15; // 480px

    let hull = 3;
    let gameOver = false;

    // Grid: 0 = Tunnel (Open), 1 = Dirt, 2 = Granite, 3 = Boulder
    const grid = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        if (r === 0) row.push(0);
        else if (r === rows - 1 || c === 0 || c === cols - 1) row.push(2);
        else row.push(1);
      }
      grid.push(row);
    }

    // Carve initial starting tunnel around surface
    for (let r = 0; r <= 3; r++) grid[r][10] = 0;

    // Kinetic Boulders
    const boulders = [
      { col: 5, row: 3, state: 'resting', timer: 0 },
      { col: 14, row: 4, state: 'resting', timer: 0 },
      { col: 8, row: 9, state: 'resting', timer: 0 }
    ];
    boulders.forEach(b => { grid[b.row][b.col] = 3; });

    // Player Excavator
    const player = {
      col: 10,
      row: 0,
      width: 24,
      height: 24,
      facing: 'down',
      color: '#38bdf8',
      tether: null // Active harpoon tether
    };

    // Subterranean Fauna
    const enemies = [
      {
        id: 'pooka_1', type: 'pooka', col: 4, row: 6,
        color: '#f97316', eyeColor: '#fef08a',
        inflateStage: 0, inflateTimer: 0, isGhost: false,
        moveTimer: 0, facing: 'right'
      },
      {
        id: 'fygar_1', type: 'fygar', col: 15, row: 8,
        color: '#22c55e', eyeColor: '#fef08a',
        inflateStage: 0, inflateTimer: 0, isGhost: false,
        moveTimer: 0, facing: 'left', fireTimer: 3.0, isBreathingFire: false
      }
    ];

    // Carve living pockets for initial enemies
    grid[6][3] = 0; grid[6][4] = 0; grid[6][5] = 0;
    grid[8][14] = 0; grid[8][15] = 0; grid[8][16] = 0;

    const keys = {};
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (gameOver) {
        if (e.code === 'Space') {
          if (gameOver) { respawnPlayer(); }
          else if (upgrades.jumpPiston && player.row >= 2 && grid[player.row - 1][player.col] === 0) {
            player.row = Math.max(0, player.row - 2);
            document.getElementById('hud-depth').innerText = `${player.row * 10}m`;
          }
          return;
        }
        return;
      }
      if (k === 'arrowup' || k === 'w') movePlayer(0, -1, 'up');
      if (k === 'arrowdown' || k === 's') movePlayer(0, 1, 'down');
      if (k === 'arrowleft' || k === 'a') movePlayer(-1, 0, 'left');
      if (k === 'arrowright' || k === 'd') movePlayer(1, 0, 'right');
      if (k === 'f' || k === 'j') handleHarpoonAction();
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function movePlayer(dc, dr, dir) {
      player.facing = dir;
      // If actively tethered, moving detaches the cable
      if (player.tether) player.tether = null;

      const nc = player.col + dc;
      const nr = player.row + dr;

      if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) return;
      if (grid[nr][nc] === 3) return;
      if (grid[nr][nc] === 2) {
        // Bedrock borders (outer walls) remain permanent
        if (nc === 0 || nc === cols - 1 || nr === totalRows - 1) return;
        // Granite strata requires the Pneumatic Jack-Drill!
        if (!upgrades.jackDrill) return;
        // Drill carves through Granite
        grid[nr][nc] = 0;
      }

      player.col = nc;
      player.row = nr;

      if (grid[nr][nc] === 1) grid[nr][nc] = 0;
      document.getElementById('hud-depth').innerText = `${nr * 10}m`;
      checkRelicPickups();
      if (nr < 15) document.getElementById('hud-sector').innerText = 'UPPER LOAM';
      else if (nr < 30) document.getElementById('hud-sector').innerText = 'DENSE GRANITE';
      else document.getElementById('hud-sector').innerText = 'MAGMA CHAMBER';
      checkRelicPickups();
      if (nr < 15) document.getElementById('hud-sector').innerText = 'UPPER LOAM';
      else if (nr < 30) document.getElementById('hud-sector').innerText = 'DENSE GRANITE';
      else document.getElementById('hud-sector').innerText = 'MAGMA CHAMBER';
    }

    function handleHarpoonAction() {
      // If already tethered to an enemy, pump air into it
      if (player.tether && player.tether.target) {
        const target = player.tether.target;
        target.inflateStage++;
        target.inflateTimer = 1.6; // Keep immobilized

        if (target.inflateStage >= 4) {
          // Pop enemy
          const idx = enemies.indexOf(target);
          if (idx !== -1) enemies.splice(idx, 1);
          player.tether = null;
          document.getElementById('hud-enemies').innerText = enemies.length;
        }
        return;
      }

      // Otherwise, fire new harpoon cable
      let dx = 0, dy = 0;
      if (player.facing === 'left') dx = -1;
      if (player.facing === 'right') dx = 1;
      if (player.facing === 'up') dy = -1;
      if (player.facing === 'down') dy = 1;

      player.tether = {
        originC: player.col,
        originR: player.row,
        dx, dy,
        reach: 1,
        maxReach: 4,
        target: null
      };

      // Check immediate raycast for enemies in facing path
      for (let step = 1; step <= player.tether.maxReach; step++) {
        const tc = player.col + dx * step;
        const tr = player.row + dy * step;

        if (tc < 0 || tc >= cols || tr < 0 || tr >= rows) break;
        if (grid[tr][tc] !== 0) break; // Harpoon stops on dirt/rock

        const hit = enemies.find(e => Math.abs(e.col - tc) < 0.7 && Math.abs(e.row - tr) < 0.7);
        if (hit) {
          player.tether.reach = step;
          player.tether.target = hit;
          hit.inflateStage = Math.max(1, hit.inflateStage);
          hit.inflateTimer = 1.6;
          break;
        }
        player.tether.reach = step;
      }
    }

    function takeDamage() {
      hull--;
      document.getElementById('hud-hull').innerText = '❤'.repeat(Math.max(0, hull));
      player.tether = null;
      if (hull <= 0) {
        gameOver = true;
        document.getElementById('game-over-banner').style.display = 'block';
      } else {
        player.col = 10;
        player.row = 0;
      }
    }

    function respawnPlayer() {
      hull = 3;
      gameOver = false;
      player.col = 10;
      player.row = 0;
      document.getElementById('hud-hull').innerText = '❤❤❤';
      document.getElementById('game-over-banner').style.display = 'none';
    }

    function updateBoulders(delta) {
      boulders.forEach(b => {
        const belowR = b.row + 1;
        if (belowR < rows && grid[belowR][b.col] === 0) {
          if (b.state === 'resting') {
            b.state = 'rumbling';
            b.timer = 0.8;
          } else if (b.state === 'rumbling') {
            b.timer -= delta;
            if (b.timer <= 0) b.state = 'falling';
          } else if (b.state === 'falling') {
            grid[b.row][b.col] = 0;
            b.row = belowR;
            grid[b.row][b.col] = 3;

            if (b.row === player.row && b.col === player.col) takeDamage();

            enemies.forEach((e, idx) => {
              if (Math.round(e.col) === b.col && Math.round(e.row) === b.row) {
                enemies.splice(idx, 1);
                document.getElementById('hud-enemies').innerText = enemies.length;
              }
            });

            if (b.row + 1 >= rows || grid[b.row + 1][b.col] !== 0) {
              b.state = 'resting';
            }
          }
        }
      });
    }

    function updateEnemies(delta) {
      enemies.forEach(e => {
        // Handle deflation over time if not tethered
        if (e.inflateStage > 0) {
          e.inflateTimer -= delta;
          if (e.inflateTimer <= 0) {
            e.inflateStage--;
            e.inflateTimer = 1.0;
            if (player.tether && player.tether.target === e && e.inflateStage === 0) {
              player.tether = null;
            }
          }
          return; // Frozen while inflated
        }

        e.moveTimer += delta;
        if (e.moveTimer > 0.45) {
          e.moveTimer = 0;

          // Simple tunnel pathing towards player
          const dc = Math.sign(player.col - e.col);
          const dr = Math.sign(player.row - e.row);

          // If in an open tunnel, move in open corridors
          let moved = false;
          const targetC = Math.round(e.col + dc);
          const targetR = Math.round(e.row + dr);

          if (grid[Math.round(e.row)][targetC] === 0) {
            e.col = targetC;
            e.facing = dc > 0 ? 'right' : 'left';
            moved = true;
          } else if (grid[targetR][Math.round(e.col)] === 0) {
            e.row = targetR;
            e.facing = dr > 0 ? 'down' : 'up';
            moved = true;
          }

          // Check contact damage with player
          if (Math.round(e.col) === player.col && Math.round(e.row) === player.row) {
            takeDamage();
          }
        }
      });
    }

    function update(delta) {
      // Smooth vertical camera tracking
      const targetCamY = Math.max(0, Math.min(totalRows - viewRows, player.row - Math.floor(viewRows / 2))) * tileSize;
      cameraY += (targetCamY - cameraY) * 0.15;
      // Smooth vertical camera tracking
      const targetCamY = Math.max(0, Math.min(totalRows - viewRows, player.row - Math.floor(viewRows / 2))) * tileSize;
      cameraY += (targetCamY - cameraY) * 0.15;
      if (gameOver) return;
      updateBoulders(delta);
      updateEnemies(delta);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Destructible Grid
      
      ctx.save();
      ctx.translate(0, -Math.round(cameraY));

      // Render Destructible Grid across active strata
      const startR = Math.max(0, Math.floor(cameraY / tileSize));
      const endR = Math.min(totalRows, startR + viewRows + 2);

      for (let r = startR; r < endR; r++) {
        for (let c = 0; c < cols; c++) {
          const tile = grid[r][c];
          const x = c * tileSize;
          const y = r * tileSize;

          if (tile === 1) {
            // Dirt color changes by depth/stratum
            if (r < 15) { ctx.fillStyle = '#78350f'; }
            else if (r < 30) { ctx.fillStyle = '#475569'; } // Granite Loam
            else { ctx.fillStyle = '#7c2d12'; } // Volcanic Loam
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.fillStyle = r < 15 ? '#92400e' : (r < 30 ? '#64748b' : '#9a3412');
            ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
          } else if (tile === 2) {
            // Dense Bedrock / Granite
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(x + 3, y + 3, tileSize - 6, tileSize - 6);
          } else if (tile === 3) {
            ctx.fillStyle = '#a8a29e';
            ctx.beginPath();
            ctx.arc(x + 16, y + 16, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#78716c';
            ctx.beginPath();
            ctx.arc(x + 14, y + 14, 9, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Dug Tunnel
            ctx.fillStyle = r >= 30 ? '#1c100e' : '#1c1917';
            ctx.fillRect(x, y, tileSize, tileSize);
          }
        }
      }

      // Render Traversal Relic Pickups
      relics.forEach(rel => {
        if (!rel.collected) {
          const rx = rel.col * tileSize + 8;
          const ry = rel.row * tileSize + 8;
          ctx.fillStyle = '#fbbf24';
          ctx.fillRect(rx, ry, 16, 16);
          ctx.font = '12px monospace';
          ctx.fillText(rel.icon, rx + 1, ry + 12);
        }
      });


      // Render Pneumatic Tether Cable
      if (player.tether) {
        const t = player.tether;
        const startX = player.col * tileSize + 16;
        const startY = player.row * tileSize + 16;
        const endX = (player.col + t.dx * t.reach) * tileSize + 16;
        const endY = (player.row + t.dy * t.reach) * tileSize + 16;

        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        // Harpoon Tip
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(endX - 3, endY - 3, 6, 6);
      }

      // Render Subterranean Fauna
      enemies.forEach(e => {
        const ex = e.col * tileSize + 16;
        const ey = e.row * tileSize + 16;
        const radius = 10 + e.inflateStage * 4; // Expands on pump!

        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(ex, ey, radius, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = e.eyeColor;
        ctx.beginPath();
        ctx.arc(ex - (e.facing === 'left' ? 4 : -2), ey - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        // Goggles for Pooka
        if (e.type === 'pooka') {
          ctx.strokeStyle = '#fef08a';
          ctx.lineWidth = 2;
          ctx.strokeRect(ex - 6, ey - 5, 12, 5);
        }
      });

      // Render Player Excavator
      const px = player.col * tileSize + 4;
      const py = player.row * tileSize + 4;
      ctx.fillStyle = player.color;
      ctx.fillRect(px, py, player.width, player.height);

      // Directional Drill Tip
      ctx.fillStyle = '#fbbf24';
      if (player.facing === 'down') ctx.fillRect(px + 8, py + player.height, 8, 4);
      if (player.facing === 'up') ctx.fillRect(px + 8, py - 4, 8, 4);
      if (player.facing === 'left') ctx.fillRect(px - 4, py + 8, 4, 8);
      if (player.facing === 'right') ctx.fillRect(px + player.width, py + 8, 4, 8);
      ctx.restore();
      ctx.restore();
    }

    let lastTime = performance.now();
    function gameLoop(now) {
      requestAnimationFrame(gameLoop);
      const delta = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(delta);
      render();
    }
    requestAnimationFrame(gameLoop);
  </script>
</body>

</html>
